<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace</title>
<meta name="theme-color" content="#0a0910">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<!-- Polices auto-hébergées (RGPD + performance) — jamais de Google Fonts CDN. -->
<style>
  @font-face{font-family:'Sora';src:url('fonts/sora-400.woff2') format('woff2');font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
  @font-face{font-family:'Poppins';src:url('fonts/poppins-600.woff2') format('woff2');font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:'Poppins';src:url('fonts/poppins-700.woff2') format('woff2');font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:'Poppins';src:url('fonts/poppins-800.woff2') format('woff2');font-weight:800;font-style:normal;font-display:swap}
  @font-face{font-family:'Inter';src:url('fonts/inter-variable.woff2') format('woff2');font-weight:100 900;font-style:normal;font-display:swap}

  /* ══════════════════════════════════════════════════════════════════════
     AUCUNE COULEUR D'ASSOCIATION N'EST ÉCRITE ICI.
     Toutes les valeurs viennent de bob-identite.js, qui les résout depuis
     la BASE. Ces valeurs de départ ne servent qu'au premier peint, avant
     que l'identité soit connue — elles évitent le flash blanc.
     ══════════════════════════════════════════════════════════════════════ */
  :root{
    --bg:#0a0910; --bg-2:#12111b; --surface:#17161f; --surface-2:#1e1c29;
    --ink:#f5f4f8; --muted:#a3a0b0; --muted-2:#6f6c7d;
    --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.16);
    --shadow:0 10px 30px -8px rgba(0,0,0,.55); --shadow-lg:0 32px 80px -28px rgba(0,0,0,.72);
    --font-display:'Sora',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
    --ls-titre:-.028em; --radius:18px; --radius-pill:100px; --radius-champ:12px;
    --ease:cubic-bezier(.22,.61,.36,1); --dur:.24s;
    --ok:#3ecf8e; --attention:#f5a524; --alerte:#ff6b5e;
    --brand:#d81e5b; --brand-lisible:#dd3c71; --brand-fill:#d81e5b; --brand-ink:#fff;
    --brand-hover:#df3a70; --brand-press:#a41645; --brand-soft:#241520; --brand-soft-2:#331926;
    --brand-2:#2f6fdb; --brand-2-lisible:#427cde;
    --grad:linear-gradient(120deg,#d81e5b,#2f6fdb);
    --halo:radial-gradient(closest-side at 82% -4%,#2a121e,transparent 68%);
    --rail:250px; --dock:66px;
  }
  *{box-sizing:border-box;font-variant-numeric:tabular-nums}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--font-body);font-size:15px;line-height:1.55;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  body::before{content:'';position:fixed;inset:0;background:var(--halo);pointer-events:none;z-index:0}
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:var(--ls-titre);margin:0;font-weight:700}
  a{color:var(--brand-lisible);text-decoration:none}
  a:hover{text-decoration:underline}
  button,input,select,textarea{font:inherit;color:inherit}
  ::selection{background:var(--brand);color:var(--brand-ink)}
  :focus-visible{outline:2px solid var(--brand-lisible);outline-offset:2px;border-radius:6px}

  /* ─── Ossature ───────────────────────────────────────────────────── */
  .app{position:relative;z-index:1;display:grid;grid-template-columns:var(--rail) 1fr;min-height:100dvh}
  .rail{
    position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:4px;
    padding:20px 14px calc(20px + env(safe-area-inset-bottom));
    border-right:1px solid var(--line);background:var(--bg-2);overflow-y:auto;
  }
  .rail .marque{display:flex;align-items:center;gap:11px;padding:4px 8px 16px;min-width:0}
  .rail .marque .n{font-family:var(--font-display);font-weight:800;font-size:16px;letter-spacing:-.02em;
    line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* La signature de l'asso peut être longue (« MÉDIA · ÉVÉNEMENT · PRODUCTION ») :
     elle se replie sur deux lignes plutôt que de se faire couper par des points
     de suspension, qui donnaient l'impression d'un texte tronqué par erreur. */
  .rail .marque .t{display:block;font-size:11px;letter-spacing:.15em;color:var(--brand-lisible);
    font-weight:700;margin-top:4px;line-height:1.35;font-family:var(--font-body)}
  .navbtn{
    display:flex;align-items:center;gap:11px;width:100%;padding:10px 12px;border:none;cursor:pointer;
    background:transparent;color:var(--muted);border-radius:12px;font-weight:600;font-size:14.5px;
    text-align:left;transition:background var(--dur) var(--ease),color var(--dur) var(--ease);
  }
  .navbtn .ic{font-size:17px;width:22px;text-align:center;flex:none;line-height:1}
  .navbtn .lb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .navbtn:hover{background:var(--surface);color:var(--ink)}
  .navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--ink)}
  .navbtn[aria-current="page"] .ic{filter:none}
  .navbtn .cpt{
    flex:none;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--brand-fill);
    color:var(--brand-ink);font-size:11.5px;font-weight:800;display:grid;place-items:center;font-family:var(--font-body)
  }
  .rail .bas{padding-top:10px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
  .rail .moi{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;min-width:0;
    margin-top:auto;background:none;border:1px solid transparent;text-align:left;font:inherit;color:inherit;
    width:100%;cursor:default}
  .rail .moi .av{width:32px;height:32px;border-radius:10px;background:var(--grad);display:grid;place-items:center;
    font-weight:800;font-size:13px;flex:none;color:#fff;font-family:var(--font-display)}
  .rail .moi .nm{font-size:13.5px;font-weight:700;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rail .moi .rl{font-size:12px;color:var(--muted-2)}
  .lien-bas{display:block;padding:7px 12px;font-size:13.5px;color:var(--muted-2);border-radius:10px}
  .lien-bas:hover{color:var(--ink);background:var(--surface);text-decoration:none}

  .main{min-width:0;display:flex;flex-direction:column}
  .vue{display:none;padding:34px 34px calc(48px + env(safe-area-inset-bottom));max-width:1120px;width:100%;margin:0 auto}
  .vue.on{display:block;animation:entree .3s var(--ease) both}
  @keyframes entree{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  /* ─── Titres de vue ──────────────────────────────────────────────── */
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--brand-lisible);margin:0 0 7px}
  .vue > h1{font-size:clamp(25px,3.4vw,33px);font-weight:800;margin:0 0 6px}
  .chapeau{color:var(--muted);margin:0 0 26px;max-width:60ch;font-size:15px}

  /* ─── Cartes ─────────────────────────────────────────────────────── */
  .carte{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px}
  /* 09/08/2026 — les onglets des canaux de discussion */
  .canaux{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
  .canal{border:1.5px solid var(--line-2);background:transparent;color:var(--muted);cursor:pointer;
    font:inherit;font-size:13.5px;font-weight:600;padding:7px 14px;border-radius:var(--radius-pill);
    transition:border-color var(--dur) var(--ease),color var(--dur) var(--ease)}
  .canal:hover{border-color:var(--brand-lisible);color:var(--ink)}
  .canal.actif{background:var(--brand-fill);border-color:var(--brand-fill);color:var(--brand-ink)}
  /* le trait qui sépare les canaux permanents des fils de projet */
  .canal-sep{width:1px;align-self:stretch;background:var(--line-2);margin:2px 4px}
  .canal-plus{border-style:dashed;color:var(--muted-2)}
  /* les réponses d'un vote : des pastilles, pas une liste — on choisit d'un doigt */
  .vote-choix{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .carte + .carte{margin-top:14px}
  .carte h2{font-size:16.5px;margin:0 0 3px;font-weight:700}
  .carte .sous{color:var(--muted);font-size:13.5px;margin:0 0 14px}
  .grille{display:grid;gap:14px}
  @media(min-width:760px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

  /* ─── Boutons ────────────────────────────────────────────────────── */
  .b{border:1px solid transparent;cursor:pointer;font-weight:700;border-radius:var(--radius-pill);
     padding:10px 18px;font-size:14px;transition:background var(--dur) var(--ease),border-color var(--dur) var(--ease),
     transform var(--dur) var(--ease);display:inline-flex;align-items:center;gap:7px;text-decoration:none;line-height:1.2}
  .b:hover{text-decoration:none;transform:translateY(-1px)}
  .b:active{transform:none}
  .b.p{background:var(--brand-fill);color:var(--brand-ink)}
  .b.p:hover{background:var(--brand-hover)}
  .b.g{background:var(--surface-2);color:var(--ink);border-color:var(--line)}
  .b.g:hover{border-color:var(--line-2)}
  .b.nu{background:transparent;color:var(--muted);padding:8px 12px}
  .b.nu:hover{color:var(--ink);background:var(--surface-2)}
  .b.sm{padding:7px 14px;font-size:13.5px}
  .b:disabled{opacity:.45;cursor:default;transform:none}

  /* ─── Pastilles ──────────────────────────────────────────────────── */
  .p{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;
     font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
     white-space:nowrap}
  .p.mien{background:var(--brand-soft-2);color:var(--ink);border-color:transparent}
  .p.neuf{background:var(--alerte-fill);color:var(--alerte-fill-ink);border-color:transparent}
  .p.fait{background:var(--ok-soft);color:var(--ok-ink);border-color:transparent}

  /* ─── Formulaires ────────────────────────────────────────────────── */
  .champ{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .champ label{font-weight:600;font-size:13px;color:var(--muted)}
  input,textarea,select{width:100%;padding:11px 13px;border:1px solid var(--line-2);border-radius:var(--radius-champ);
    background:var(--bg-2);color:var(--ink);transition:border-color var(--dur) var(--ease)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand-lisible)}
  textarea{resize:vertical;min-height:78px;line-height:1.5}
  select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}

  /* ─── Le pouls (chiffres) ────────────────────────────────────────── */
  .pouls{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:12px;margin-bottom:26px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 17px}
  .kpi .n{font-family:var(--font-display);font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:3px}

  /* ─── Cartes projet ──────────────────────────────────────────────── */
  .barre{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
  .pgrille{display:grid;gap:14px;grid-template-columns:1fr}
  @media(min-width:700px){.pgrille{grid-template-columns:1fr 1fr}}
  /* ⚠️ Un <button> centre verticalement son contenu quand il est plus haut que
     lui : dans une grille, deux cartes voisines de contenus inégaux voyaient
     leurs titres décalés. D'où le flex-colonne ancré en haut. */
  .proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 19px;
        cursor:pointer;transition:border-color var(--dur) var(--ease),transform var(--dur) var(--ease),
        box-shadow var(--dur) var(--ease);text-align:left;width:100%;font:inherit;color:inherit;
        display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
  .proj:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:var(--shadow)}
  .proj h3{font-size:16px;margin:0 0 5px;font-weight:700}
  .proj .pitch{color:var(--muted);font-size:13.5px;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .proj .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
  .jauge{height:5px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:13px}
  .jauge i{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .5s var(--ease)}
  .jauge-lb{display:flex;justify-content:space-between;font-size:12px;color:var(--muted-2);margin-top:6px}

  /* ─── Le fil (comptoir & projets) ────────────────────────────────── */
  .msg{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
  .msg:last-child{border-bottom:none}
  .msg .av{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center;
    font-weight:800;font-size:12px;background:var(--surface-2);color:var(--muted);font-family:var(--font-display)}
  .msg .co{min-width:0;flex:1}
  .msg .qui{font-weight:700;font-size:13.5px}
  .msg .qd{color:var(--muted-2);font-size:12px;margin-left:7px;font-weight:500}
  .msg .tx{margin:3px 0 0;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
  .msg img{max-width:min(100%,420px);border-radius:12px;margin-top:9px;display:block;border:1px solid var(--line)}
  .redac{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
  .redac .ln{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}

  /* ─── Vide (états honnêtes) ──────────────────────────────────────── */
  .vide{text-align:center;padding:34px 20px;color:var(--muted)}
  .vide .ic{font-size:34px;opacity:.55;display:block;margin-bottom:10px}
  .vide h3{font-size:16px;margin:0 0 5px;color:var(--ink)}
  .vide p{margin:0 auto;max-width:44ch;font-size:14px}
  .vide .b{margin-top:16px}
  .vide-ok{margin:0;padding:12px 14px;border-radius:12px;background:var(--ok-soft);color:var(--ok-ink);
    font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:2px}

  /* ─── Galerie ────────────────────────────────────────────────────── */
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
  .gal figure{margin:0;position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;
    background:var(--surface-2);border:1px solid var(--line);cursor:zoom-in}
  .gal img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s var(--ease)}
  .gal figure:hover img{transform:scale(1.045)}
  .gal figcaption{position:absolute;inset:auto 0 0 0;padding:16px 10px 8px;font-size:12px;font-weight:600;
    background:linear-gradient(transparent,rgba(0,0,0,.9));color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.85);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ─── Panneau (fiche projet) ─────────────────────────────────────── */
  .voile{position:fixed;inset:0;background:rgba(5,4,9,.68);backdrop-filter:blur(3px);z-index:60;
    display:none;align-items:flex-end;justify-content:center}
  .voile.on{display:flex}
  .panneau{background:var(--bg-2);border:1px solid var(--line);width:100%;max-width:780px;max-height:94dvh;
    overflow-y:auto;border-radius:22px 22px 0 0;box-shadow:var(--shadow-lg);
    padding:22px 22px calc(30px + env(safe-area-inset-bottom));animation:monte .3s var(--ease) both}
  @keyframes monte{from{transform:translateY(22px);opacity:0}to{transform:none;opacity:1}}
  @media(min-width:780px){.voile{align-items:center}.panneau{border-radius:22px;max-height:90dvh}}
  .ptete{display:flex;align-items:flex-start;gap:12px;margin-bottom:6px}
  .ptete h2{flex:1;font-size:21px;font-weight:800}
  .x{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;
     width:34px;height:34px;font-size:15px;cursor:pointer;flex:none;line-height:1}
  .x:hover{border-color:var(--line-2)}
  .bloc{border-top:1px solid var(--line);padding-top:16px;margin-top:16px}
  .bloc h3{font-size:14px;font-weight:700;margin:0 0 3px}
  .bloc .sous{color:var(--muted);font-size:12.5px;margin:0 0 11px}

  /* ─── Étapes ─────────────────────────────────────────────────────── */
  .etape{display:flex;align-items:flex-start;gap:11px;padding:9px 0;border-bottom:1px dashed var(--line)}
  .etape:last-child{border-bottom:none}
  .etape input[type=checkbox]{width:19px;height:19px;flex:none;margin-top:2px;accent-color:var(--brand-fill);cursor:pointer}
  .etape .tx{flex:1;font-size:14.5px}
  .etape.ok .tx{text-decoration:line-through;color:var(--muted-2)}
  .etape .sup{border:none;background:none;color:var(--muted-2);cursor:pointer;font-size:14px;padding:2px 5px}
  .etape .sup:hover{color:var(--alerte)}

  /* ─── Barre mobile ───────────────────────────────────────────────── */
  .dock{display:none}
  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    /* ⚠️ PAS d'`overflow-x:auto` ici : dès qu'un axe est en `auto`, le navigateur
       rogne AUSSI l'autre — et le menu du compte, positionné sous le rail,
       disparaissait. Les onglets sont masqués sur téléphone, il n'y a plus rien
       à faire défiler. */
    .rail{position:static;height:auto;flex-direction:row;align-items:center;gap:8px;padding:10px 14px;
      border-right:none;border-bottom:1px solid var(--line);overflow:visible}
    .rail .marque{padding:0;flex:1;min-width:0}
    .rail .navbtn{display:none}
    /* Le bloc du bas quitte la colonne et devient un menu sous l'avatar :
       sans lui, il n'existait AUCUN moyen de se déconnecter sur téléphone. */
    .rail .bas{position:absolute;top:calc(100% - 6px);right:12px;z-index:60;margin:0;padding:8px;
      background:var(--bg-2);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);
      min-width:196px;display:none}
    .rail .bas.on{display:flex}
    /* Le rail doit passer AU-DESSUS du contenu, sinon le menu s'ouvre derrière
       la vue (qui est animée, donc peinte dans son propre plan). */
    .rail{position:relative;z-index:70}
    .rail .moi{padding:4px;cursor:pointer;margin-top:0;width:auto;flex:none}
    .rail .moi:hover{border-color:var(--line-2)}
    .rail .moi .nm,.rail .moi .rl{display:none}
    .rail .moi::after{content:'▾';color:var(--muted);font-size:11px}
    .vue{padding:22px 16px calc(var(--dock) + 34px + env(safe-area-inset-bottom))}
    .dock{
      display:flex;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--bg-2) 92%,transparent);
      backdrop-filter:saturate(150%) blur(14px);border-top:1px solid var(--line);
      padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around
    }
    .dock button{flex:1;max-width:96px;background:none;border:none;cursor:pointer;color:var(--muted-2);
      display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;position:relative}
    .dock button .ic{font-size:19px;line-height:1}
    .dock button .lb{font-size:10.5px;font-weight:700;letter-spacing:-.01em}
    .dock button[aria-current="page"]{color:var(--brand-lisible)}
    .dock button .pt{position:absolute;top:3px;right:calc(50% - 20px);width:8px;height:8px;border-radius:50%;background:var(--alerte)}
  }

  /* ─── Bandeau & divers ───────────────────────────────────────────── */
  .bandeau{background:var(--brand-soft);border:1px solid var(--line);border-radius:14px;padding:13px 16px;
    font-size:13.5px;margin-bottom:20px;display:flex;gap:11px;align-items:flex-start}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,52px);background:var(--ink);color:var(--bg);
    padding:11px 20px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:var(--shadow-lg);
    opacity:0;transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease);z-index:99;

  /* Certains emojis (📸 🪪 🎞️…) ont une chasse qui MANGE visuellement l'espace

  .em{display:inline-block;min-width:1.3em;margin-right:.28em;text-align:center;font-style:normal}
  /* Dans un conteneur flex, le `gap` sépare déjà le pictogramme du texte. */
  .b .em,.navbtn .em{margin-right:0;min-width:1.15em}

  @media (prefers-reduced-motion: reduce){

<script>
/* ══════════════════════════════════════════════════════════════════════════

   TROIS RÈGLES TENUES ICI

   CE QUE LA RLS AUTORISE VRAIMENT (mesuré le 07/08/2026 — à ne pas oublier

                   → tout membre ACTIF de l'asso, si la fonctionnalité est on.
   ══════════════════════════════════════════════════════════════════════════ */
const SUPABASE_URL='https://dkidtwypclpwznleiqnq.supabase.co';
const SUPABASE_KEY='sb_publishable_HDfV-O2ION1Vw9v03aV_Qg_PkiAjLNo';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>(s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),3400);}

/* ─── État ────────────────────────────────────────────────────────────── */

const estBureau=()=>!!ME&&['president','tresorier','bureau'].includes(ME.role);

const feat=k=>{try{const v=(ASSO&&ASSO.features||{})[k];return v===true||v==='on';}catch(e){return false;}};
const partsDe=id=>PARTS.filter(x=>x.project_id===id);

const STATUTS={actif:'🟢 En cours',termine:'🏁 Terminé',archive:'📦 Archivé'};

/* ─── Dates ───────────────────────────────────────────────────────────── */
function d2(n){return String(n).padStart(2,'0');}
function dateCourte(iso){const d=new Date(iso);if(isNaN(d))return '';return d2(d.getDate())+'/'+d2(d.getMonth()+1)+'/'+d.getFullYear();}
function dateHeure(iso){const d=new Date(iso);if(isNaN(d))return '';return dateCourte(iso)+' à '+d2(d.getHours())+'h'+d2(d.getMinutes());}
function ilYA(iso){
  const d=new Date(iso); if(isNaN(d)) return '';
  const s=Math.floor((Date.now()-d.getTime())/1000);
  if(s<60)return "à l'instant";
  if(s<3600)return 'il y a '+Math.floor(s/60)+' min';
  if(s<86400)return 'il y a '+Math.floor(s/3600)+' h';
  if(s<604800){const j=Math.floor(s/86400);return 'il y a '+j+' jour'+(j>1?'s':'');}
  return 'le '+dateCourte(iso);
}
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
/* Toujours avec l'année : une date sans année devient fausse au 1er janvier. */
function dateLongue(d){ return JOURS[d.getDay()]+' '+d.getDate()+' '+MOIS[d.getMonth()]+' '+d.getFullYear(); }
function initiales(n){
  return String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'?';
}

/* ─── « Du neuf » ─────────────────────────────────────────────────────────
   Mémorisé sur CET appareil (pas d'infrastructure, pas de table). On garde les
   clés `bob_vu_<id>` de la version précédente : l'historique de lecture des
   adhérents n'est pas perdu au passage sur ce nouvel écran. */
const vuGet=id=>{try{return localStorage.getItem('bob_vu_'+id)||'';}catch(e){return '';}};
const vuSet=id=>{try{localStorage.setItem('bob_vu_'+id,new Date().toISOString());}catch(e){}};
function nonLus(projectId){
  const v=vuGet(projectId);
  return POSTS.filter(m=>m.project_id===projectId
    && m.author_id!==(ME&&ME.id)
    && (!v||new Date(m.created_at).getTime()>new Date(v).getTime()));
}
const aDuNeuf=id=>nonLus(id).length>0;
function toutLeNeuf(){
  const ids={};(PROJETS.concat(COMPTOIR?[COMPTOIR]:[])).forEach(p=>ids[p.id]=p);
  return POSTS.filter(m=>ids[m.project_id]).filter(m=>{
    const v=vuGet(m.project_id);
    return m.author_id!==(ME&&ME.id)&&(!v||new Date(m.created_at).getTime()>new Date(v).getTime());
  }).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
}

/* ─── Navigation ──────────────────────────────────────────────────────── */
/* Chaque section déclare la condition qui l'allume. Une section n'apparaît
   jamais « parce que c'est ce client » : elle apparaît parce qu'une DONNÉE
   de l'asso l'autorise. */
const SECTIONS=[
  {k:'accueil', ic:'🏠', lb:'Accueil',   court:'Accueil', ouvert:()=>true},
  {k:'projets', ic:'🎬', lb:'Projets',   court:'Projets', ouvert:()=>feat('projets_adherents')},
  {k:'comptoir',ic:'🗣️', lb:'Le comptoir',court:'Comptoir',ouvert:()=>feat('projets_adherents')&&!!COMPTOIR},
  {k:'galerie', ic:'📸', lb:'Galerie',   court:'Photos',  ouvert:()=>feat('projets_adherents')},
  {k:'materiel',ic:'🧰', lb:'Matériel',  court:'Matériel',ouvert:()=>feat('materiel')},
  {k:'fiches',  ic:'📚', lb:'Fiches techniques',court:'Fiches',ouvert:()=>feat('fiches_techniques')},
  {k:'bureau',  ic:'🏛️', lb:'Le bureau', court:'Bureau',  ouvert:()=>estBureau()}
];
const sectionsOuvertes=()=>SECTIONS.filter(s=>{try{return s.ouvert();}catch(e){return false;}});

function badgeDe(k){
  if(k==='accueil')return toutLeNeuf().length;
  if(k==='projets')return PROJETS.filter(p=>aDuNeuf(p.id)).length;
  if(k==='comptoir')return COMPTOIR?nonLus(COMPTOIR.id).length:0;
  return 0;
}
function renderNav(){
  const list=sectionsOuvertes();
  $('#nav').innerHTML=list.map(s=>{
    const n=badgeDe(s.k);
    return '<button class="navbtn" data-vue="'+s.k+'"'+(VUE===s.k?' aria-current="page"':'')+'>'

  /* Une asso qui fait du périscolaire/ACM (le CASE) a AUSSI un espace famille :

  +(feat('f_metier_acm')
     ?'<a class="navbtn" href="espace-adherent.html" style="text-decoration:none">'

      +'<span class="cpt" style="background:transparent;color:var(--muted-2)">↗</span></a>'
     :'');
  /* La barre du bas ne tient pas 7 entrées : on garde les 5 premières ouvertes. */
  $('#dock').innerHTML=list.slice(0,5).map(s=>{
    const n=badgeDe(s.k);
    return '<button data-vue="'+s.k+'"'+(VUE===s.k?' aria-current="page"':'')+'>'
      +'<span class="ic" aria-hidden="true">'+s.ic+'</span><span class="lb">'+esc(s.court)+'</span>'
      +(n?'<span class="pt" aria-label="du nouveau"></span>':'')+'</button>';
  }).join('');
}
function aller(k){
  if(!sectionsOuvertes().some(s=>s.k===k)) k='accueil';
  VUE=k;
  try{history.replaceState(null,'','#'+k);}catch(e){}
  renderNav();
  const rendus={accueil:vueAccueil,projets:vueProjets,comptoir:vueComptoir,
                galerie:vueGalerie,materiel:vueMateriel,fiches:vueFiches,bureau:vueBureau};
  $('#main').innerHTML='<div class="vue on" id="v"></div>';
  (rendus[k]||vueAccueil)($('#v'));
  window.scrollTo({top:0,behavior:'instant'});
}

/* ══════════════════════════════════════════════════════════════════════════
   VUE · ACCUEIL — « ce qui se passe »
   L'écran qui n'existait pas. Il répond à trois questions qu'un adhérent se
   pose en arrivant : qu'est-ce qui a bougé ? qu'est-ce qu'on attend de moi ?
   où en est l'asso ?
   ══════════════════════════════════════════════════════════════════════════ */
function salutation(){
  const h=new Date().getHours();
  return h<5?'Bonne nuit':h<12?'Bonjour':h<18?'Bonjour':'Bonsoir';
}
function vueAccueil(el){
  const neuf=toutLeNeuf();
  const miens=PROJETS.filter(p=>p.owner_id===ME.id);
  const jeSuisDedans=PROJETS.filter(p=>jeParticipe(p.id)&&p.owner_id!==ME.id);
  /* Ce qui m'attend : des étapes à moi restées non cochées. */
  const aFaire=[];
  miens.forEach(p=>{
    const js=Array.isArray(p.data&&p.data.jalons)?p.data.jalons:[];
    const reste=js.filter(j=>!j.done);
    if(reste.length) aFaire.push({projet:p,etape:reste[0].t,reste:reste.length});
  });
  const publies=PROJETS.filter(p=>p.data&&p.data.publie_le)
                       .sort((a,b)=>new Date(a.data.publie_le)-new Date(b.data.publie_le));

  let h='';
  /* La signature de l'asso est déjà sous le logo : la répéter ici en sur-titre
     la disait deux fois sur le même écran (flagrant sur téléphone). On met à la
     place ce que ce sur-titre peut apporter d'utile — la date du jour. */
  h+='<p class="eyebrow">'+esc(dateLongue(new Date()))+'</p>';
  h+='<h1>'+salutation()+' '+esc(ME.name)+'</h1>';
  h+='<p class="chapeau">'+(neuf.length
      ? 'Il s\'est passé <b>'+neuf.length+' chose'+(neuf.length>1?'s':'')+'</b> depuis ton dernier passage.'
      : 'Rien de nouveau depuis ton dernier passage — tout est à jour.')+'</p>';

  /* Le pouls : uniquement des chiffres que la base sait vraiment produire. */
  const actifs=PROJETS.filter(p=>((p.data&&p.data.statut)||'actif')==='actif').length;
  const mois=POSTS.filter(m=>new Date(m.created_at)>new Date(Date.now()-30*864e5)).length;
  const photos=POSTS.filter(m=>m.photo_path).length;
  h+='<div class="pouls">'
   + kpi(actifs,'projet'+(actifs>1?'s':'')+' en cours')
   + kpi(mois,'message'+(mois>1?'s':'')+' ce mois-ci')
   + kpi(photos,'photo'+(photos>1?'s':'')+' partagée'+(photos>1?'s':''))
   + kpi(miens.length+jeSuisDedans.length,'tes engagements')
   + '</div>';

  /* 🗳️ 09/08/2026 — les votes ouverts, EN TÊTE de l'accueil : une décision qui attend la voix
     de quelqu'un passe avant les nouvelles. Le conteneur est rempli après coup (il faut lire la
     base) — vide, il ne prend aucune place. */
  h+='<div id="zoneVotes"></div>';

  /* ① Ce qui a bougé — la réponse au « comment je sais qu'il y a du neuf ». */
  h+='<div class="carte"><h2><span class="em">⚡</span>Ce qui a bougé</h2>'
   + '<p class="sous">Les derniers messages, tous fils confondus. Clique pour ouvrir le fil.</p>';
  if(neuf.length){
    h+=neuf.slice(0,6).map(m=>msgLigne(m,true)).join('');
    if(neuf.length>6) h+='<p class="sous" style="margin:12px 0 0">…et '+(neuf.length-6)+' de plus.</p>';
  }else{
    const recents=POSTS.slice(0,4);
    h+= recents.length
      ? '<p class="sous" style="margin:-6px 0 12px">Rien de neuf pour toi — voici les derniers échanges.</p>'
        + recents.map(m=>msgLigne(m,true)).join('')
      : vide('💬','Le fil est encore vide',
             'Personne n\'a écrit pour l\'instant. Ouvre le comptoir et lance la discussion — c\'est comme ça que ça démarre.',
             COMPTOIR?'<button class="b p" data-aller="comptoir">Ouvrir le comptoir</button>':'');
  }
  h+='</div>';

  /* ② Ce qui t'attend */
  h+='<div class="carte"><h2><span class="em">✅</span>Ce qui t\'attend</h2>';
  if(aFaire.length){
    h+='<p class="sous">Tes prochaines étapes sur les projets que tu portes.</p>';
    h+=aFaire.slice(0,5).map(x=>
      '<div class="msg" style="cursor:pointer" data-projet="'+esc(x.projet.id)+'">'
      +'<span class="av">→</span><div class="co">'
      +'<span class="qui">'+esc(x.etape)+'</span>'
      +'<p class="tx" style="color:var(--muted);font-size:13px">'+esc(x.projet.name)+' · '+x.reste+' étape'+(x.reste>1?'s':'')+' restante'+(x.reste>1?'s':'')+'</p>'
      +'</div></div>').join('');
  }else if(miens.length){
    h+=videOk('🎉','Aucune étape en attente sur tes projets. Bien joué.');
  }else{
    h+=vide('🎬','Tu ne portes pas encore de projet',
      'Une idée de tournage, de portrait, de captation ? Ouvre-la ici : tu décris, tu découpes en étapes, et l\'équipe peut t\'aider.',
      feat('projets_adherents')?'<button class="b p" data-nouveau="1">Créer mon premier projet</button>':'');
  }
  h+='</div>';

  /* ③ L'horloge des publications — ce que regarde un financeur de média.
     Une publication datée est la seule preuve d'antériorité d'un média. */
  if(feat('projets_adherents')){
    h+='<div class="carte"><h2><span class="em">🎞️</span>Ce qui est sorti</h2>'
     + '<p class="sous">Les projets que l\'association a publiés, et depuis quand. C\'est la première chose que regarde un financeur de média.</p>';
    if(publies.length){
      const prem=publies[0];
      const jours=Math.floor((Date.now()-new Date(prem.data.publie_le).getTime())/864e5);
      h+='<div class="bandeau"><span style="font-size:19px">⏱️</span><div>'
       + '<b>Première publication le '+esc(dateCourte(prem.data.publie_le))+'</b> — il y a '+jours+' jour'+(jours>1?'s':'')+'.'
       + '<br><span style="color:var(--muted)">C\'est cette date qui fait l\'antériorité de l\'association comme média.</span></div></div>';
      h+='<div class="pgrille">'+publies.slice().reverse().map(carteProjet).join('')+'</div>';
    }else{
      h+=vide('📡','Rien n\'est encore sorti',
        'Aucun projet n\'est marqué comme publié. Dès qu\'une vidéo, un portrait ou un reportage est en ligne, ouvre sa fiche et note la date de sortie : c\'est elle qui prouve l\'ancienneté du média.');
    }
    h+='</div>';
  }
  el.innerHTML=h;
  chargerVotes();
}

/* ═══ 🗳️ LES VOTES ═══════════════════════════════════════════════════════════════════════════
   09/08/2026, Guillaume : « une sorte de petit vote, une décision, tout le monde vote, et quand
   tout le monde a voté ça valide » — avec des propositions ET une option « Autre » où l'on écrit
   son propre mot. Le bureau pose la question, chacun répond une fois.

   Deux verrous sont EN BASE, pas ici : une personne = une voix (contrainte unique), et on ne
   vote ni à la place d'un autre ni après la clôture (policies, prouvées par impersonation).
   L'écran ne fait que rendre honnêtement ce que la base autorise.

   ⚠️ « Combien sont attendus » vient de `vote_avancement()` : un adhérent ne lit pas `profiles`
   au-delà de lui-même, il compterait 1 attendu et croirait le vote terminé après sa voix. */
async function chargerVotes(){
  const zone=$('#zoneVotes'); if(!zone||!ME) return;
  const rv=await sb.from('votes').select('id,question,options,autre_permis,statut,created_at')
                   .eq('statut','ouvert').order('created_at',{ascending:false});
  /* Le bureau peut toujours en lancer un — même quand il n'y a aucun vote en cours, sinon
     personne ne découvre que la fonction existe. */
  const lancer = estBureau()
    ? '<p class="sous" style="margin:10px 0 0"><button class="b nu sm" data-votenouveau="1">🗳️ Lancer un vote</button></p>'
    : '';
  if(rv.error||!(rv.data||[]).length){
    zone.innerHTML = lancer ? '<div class="carte" style="padding:14px 18px">'+lancer+'</div>' : '';
    return;
  }
  const mien=await sb.from('vote_voix').select('vote_id,choix').eq('user_id',ME.id);
  const maVoix={}; (mien.data||[]).forEach(v=>{ maVoix[v.vote_id]=v.choix; });

  const blocs=await Promise.all((rv.data||[]).map(async v=>{
    const [av,res]=await Promise.all([
      sb.rpc('vote_avancement',{p_vote:v.id}),
      maVoix[v.id] ? sb.rpc('vote_resultat',{p_vote:v.id}) : Promise.resolve({data:[]})
    ]);
    const a=(av.data&&av.data[0])||{votants:0,attendus:0,complet:false};
    const opts=Array.isArray(v.options)?v.options:[];
    const dejaVote=!!maVoix[v.id];

    let h='<div class="carte" style="border-left:3px solid var(--brand)">'
      +'<h2><span class="em" aria-hidden="true">🗳️</span>'+esc(v.question)+'</h2>';

    if(!dejaVote){
      h+='<p class="sous">Choisis une réponse. Tu pourras en changer tant que le vote est ouvert.</p>'
        +'<div class="vote-choix" role="group" aria-label="Les réponses possibles">'
        + opts.map(o=>'<button class="b g sm" data-vote="'+esc(v.id)+'" data-choix="'+esc(o)+'">'+esc(o)+'</button>').join('')
        + '</div>'
        + (v.autre_permis
            ? '<div class="ln" style="margin-top:10px">'
              +'<input class="champ" id="vAutre-'+esc(v.id)+'" placeholder="Autre — écris ton idée" maxlength="60" style="flex:1">'
              +'<button class="b p sm" data-voteautre="'+esc(v.id)+'">Proposer</button></div>'
            : '');
    } else {
      h+='<p class="sous">Ta réponse : <b>'+esc(maVoix[v.id])+'</b> — '
        +'<button class="b nu sm" data-votechanger="'+esc(v.id)+'">changer</button></p>';
      const li=(res.data||[]);
      if(li.length) h+='<div style="margin-top:6px">'+li.map(r=>
          '<div style="display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13.5px">'
          +'<span style="flex:0 0 130px">'+esc(r.choix)+'</span>'
          +'<span style="flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden">'
          +'<span style="display:block;height:100%;width:'+Number(r.part)+'%;background:var(--brand-fill)"></span></span>'
          +'<span style="flex:0 0 62px;text-align:right;color:var(--muted)">'+r.voix+' voix</span></div>').join('')+'</div>';
    }
    h+='<p class="sous" style="margin-top:10px">'
      + (a.complet
          ? '✅ <b>Tout le monde a voté.</b> Le bureau peut clore et acter la décision.'
          : '👥 '+a.votants+' voix sur '+a.attendus+' membre'+(a.attendus>1?'s':'')+' — il en manque '+Math.max(0,a.attendus-a.votants)+'.')
      +'</p></div>';
    return h;
  }));
  zone.innerHTML=blocs.join('')+(lancer?'<p class="sous" style="margin:2px 0 14px">'+lancer.replace(/<\/?p[^>]*>/g,'')+'</p>':'');
}
/* Lancer un vote — réservé au bureau (policy `ins_votes` : can_write()). Volontairement en trois
   questions, pas un écran de plus : la question, les réponses possibles, et c'est parti. */
async function nouveauVote(){
  const q=(prompt('La question posée à tout le monde ?\n\nPar exemple : « Comment on appelle une proposition d\'activité ? »')||'').trim();
  if(!q) return;
  const brut=(prompt('Les réponses possibles, séparées par des virgules.\n\nPar exemple : Envies, Propositions, Ça se monte')||'').trim();
  const opts=brut.split(',').map(x=>x.trim()).filter(Boolean).slice(0,10);
  if(!opts.length){ toast('Il faut au moins une réponse possible'); return; }
  const autre=confirm('Autoriser « Autre » (chacun peut écrire sa propre réponse) ?\n\nOK = oui   ·   Annuler = non');
  const r=await sb.from('votes').insert({ asso_id:ME.asso, question:q.slice(0,300), options:opts,
    autre_permis:autre, cree_par:ME.id, cree_par_nom:ME.name });
  if(r.error){ toast('Impossible : '+r.error.message); return; }
  toast('🗳️ Vote lancé');
  chargerVotes();
}
async function voter(voteId, choix){
  if(!ME||ME.statut!=='actif'){ toast('Ton compte doit être validé pour voter'); return; }
  choix=String(choix||'').trim().slice(0,60);
  if(!choix){ toast('Écris ou choisis une réponse'); return; }
  /* on tente la mise à jour d'abord : si la personne change d'avis, l'insertion buterait sur
     la contrainte « une voix par personne » — le message serait juste, mais incompréhensible. */
  const maj=await sb.from('vote_voix').update({choix:choix}).eq('vote_id',voteId).eq('user_id',ME.id).select('id');
  if(maj.error){ toast('Vote impossible : '+maj.error.message); return; }
  if(!(maj.data||[]).length){
    const ins=await sb.from('vote_voix').insert({asso_id:ME.asso, vote_id:voteId, user_id:ME.id, nom:ME.name, choix:choix});
    if(ins.error){ toast('Vote impossible : '+ins.error.message); return; }
  }
  toast('✅ Ta voix est enregistrée');
  chargerVotes();
}

/* Deux poids d'état vide. Le grand appelle à agir (première fois, rien à faire) ;

/* ══════════════════════════════════════════════════════════════════════════
   VUE · PROJETS
   ══════════════════════════════════════════════════════════════════════════ */
function avancement(p){
  const js=Array.isArray(p.data&&p.data.jalons)?p.data.jalons:[];
  if(!js.length) return null;
  const f=js.filter(j=>j.done).length;
  return {faits:f,total:js.length,pct:Math.round(f/js.length*100)};
}
function carteProjet(p){
  const d=p.data||{};
  const mien=p.owner_id===ME.id;
  const av=avancement(p);
  const n=partsDe(p.id).length;
  const nl=nonLus(p.id).length;
  return '<button class="proj" data-projet="'+esc(p.id)+'">'
    +'<h3>'+esc(p.name||'Sans nom')+'</h3>'
    +'<p class="pitch">'+esc(d.pitch||'Pas encore de description.')+'</p>'
    +'<div class="meta">'
      +'<span class="p'+(mien?' mien':'')+'">'+(mien?'⭐ Mon projet':'👤 '+esc(d.porteur_nom||'Un adhérent'))+'</span>'
      +'<span class="p">'+esc(STATUTS[d.statut||'actif']||STATUTS.actif)+'</span>'
      +(d.publie_le?'<span class="p fait"><span class="em">🎞️</span>Publié le '+esc(dateCourte(d.publie_le))+'</span>':'')
      +(nl?'<span class="p neuf">'+nl+' nouveau'+(nl>1?'x':'')+'</span>':'')
      +(n?'<span class="p'+(jeParticipe(p.id)?' fait':'')+'">👥 '+n+'</span>':'')
    +'</div>'
    +(av?'<div class="jauge"><i style="width:'+av.pct+'%"></i></div>'
        +'<div class="jauge-lb"><span>'+av.faits+' / '+av.total+' étapes</span><span>'+av.pct+'%</span></div>':'')
    +'</button>';
}
/* Filtre courant de la liste des projets (mémoire de session, pas de réglage). */
let FILTRE='tous';
function vueProjets(el){
  /* ⚠️ UNE SEULE LISTE, et elle contient TOUJOURS mes projets.
     Deux listes (« ce que je porte » puis « tous ») affichaient la même carte
     deux fois sur le même écran — ça se lit comme un bug. Mais on ne peut pas
     non plus retirer les miens de la liste commune : un adhérent avait cru que
     son projet n'était pas enregistré parce qu'il ne le voyait pas là où tout le
     monde regarde (retour de terrain, 04/08/2026). La liste unique triée
     « les miens d'abord » tient les deux exigences. */
  const miens=PROJETS.filter(p=>p.owner_id===ME.id);
  const avecMoi=PROJETS.filter(p=>jeParticipe(p.id)||p.owner_id===ME.id);
  const FILTRES={
    tous:{lb:'Tous',       liste:PROJETS.slice().sort((a,b)=>(b.owner_id===ME.id)-(a.owner_id===ME.id))},
    miens:{lb:'Les miens', liste:miens},
    moi:{lb:'J\'y participe', liste:avecMoi}
  };
  const cur=FILTRES[FILTRE]||FILTRES.tous;

  let h='<p class="eyebrow">L\'établi</p><h1>Les projets</h1>'
   +'<p class="chapeau">Chacun porte le sien. Tout le monde peut suivre, commenter et donner un coup de main.</p>'
   +'<div class="barre">'
   +'<button class="b p" data-nouveau="1"><span class="em">➕</span>Nouveau projet</button>'
   +'<span style="flex:1"></span>'
   +Object.keys(FILTRES).map(k=>'<button class="b '+(FILTRE===k?'p':'g')+' sm" data-filtre="'+k+'">'
      +esc(FILTRES[k].lb)+' <span class="p" style="background:transparent;border:none;padding:0 0 0 2px;font-size:12px">'
      +FILTRES[k].liste.length+'</span></button>').join('')
   +'</div>';

  if(!PROJETS.length){
    h+='<div class="carte">'+vide('🎬','Aucun projet pour l\'instant',
      'Décris ton idée en deux phrases — tu compléteras après. Choisis « sortie photo / vidéo » et les dix étapes du terrain sont déjà prêtes.',
      '<button class="b p" data-nouveau="1">Créer le premier projet</button>')+'</div>';
  }else if(!cur.liste.length){
    h+='<div class="carte">'+vide('🔍','Rien dans ce filtre',
      FILTRE==='miens'?'Tu ne portes encore aucun projet — lance le tien.':'Tu ne participes à aucun projet pour l\'instant.',
      '<button class="b g" data-filtre="tous">Voir tous les projets</button>')+'</div>';
  }else{
    h+='<div class="pgrille">'+cur.liste.map(carteProjet).join('')+'</div>';
  }
  el.innerHTML=h;
}

/* ══════════════════════════════════════════════════════════════════════════
   VUE · COMPTOIR — le fil général, plein écran
   ══════════════════════════════════════════════════════════════════════════ */
function vueComptoir(el){
  /* 09/08/2026 — une asso qui arrive n'a AUCUN canal (vérifié : PIX-I-ART en avait zéro) et
     tombait sur « le bureau ne l'a pas encore ouvert », sans moyen d'en sortir. Le bureau peut
     désormais l'ouvrir d'un clic ; pour les autres, le message dit au moins quoi attendre. */
  if(!COMPTOIR){
    el.innerHTML='<div class="carte">'+(estBureau()
      ? vide('🗣️','La discussion n\'est pas encore ouverte',
             'Ouvre le canal général : c\'est là que tout le monde se parle, pose ses questions et donne des nouvelles.',
             '<button class="b p" data-canalgeneral="1">Ouvrir la discussion</button>')
      : vide('🗣️','Pas encore de discussion',
             'Le bureau ne l\'a pas encore ouverte. Tu peux la demander avec le bouton 💡, en bas.'))
      +'</div>';
    return;
  }
  /* 09/08/2026 — un onglet par canal quand il y en a plusieurs. Un seul canal : on n'affiche
     aucune barre, pour ne pas fabriquer un choix qui n'en est pas un. */
  /* 09/08/2026 — la barre réunit TOUS les fils au même endroit, comme un salon de discussion :
     les canaux permanents (général, bureau, thématiques) puis un canal PAR PROJET EN COURS.
     Les fils de projet existaient déjà — ils étaient seulement rangés dans « Projets », donc
     invisibles quand on venait pour discuter. On ne duplique rien : même table, même fil. */
  const projetsOuverts = PROJETS.filter(p=>((p.data&&p.data.statut)||'actif')==='actif');
  const onglet = (c,ic) => '<button role="tab" class="canal'+(c.id===COMPTOIR.id?' actif':'')+'"'
      +' aria-selected="'+(c.id===COMPTOIR.id)+'" data-canal="'+esc(c.id)+'">'
      + (ic?'<span class="em" aria-hidden="true">'+ic+'</span>':'') + esc(c.name)
      + ((c.data&&c.data.acces==='bureau')?' <span class="em" title="Réservé au bureau" aria-label="réservé au bureau">🔒</span>':'')
      +'</button>';
  const plusieurs = (CANAUX.length + projetsOuverts.length) > 1;
  const barre = plusieurs
    ? '<div class="canaux" role="tablist" aria-label="Les canaux de discussion">'
      + CANAUX.map(c=>onglet(c,'')).join('')
      + (projetsOuverts.length?'<span class="canal-sep" aria-hidden="true"></span>':'')
      /* l'emblème vient de l'identité du tenant : un clap chez un média, un ananas au CASE,
         une trompette chez une harmonie. Jamais l'emoji du métier de celui qu'on a sous les yeux. */
      + projetsOuverts.map(p=>onglet(p,(ID&&ID.embleme)||'•')).join('')
      + (VOIR_ARCHIVES ? CANAUX_ARCHIVES.map(c=>onglet(c,'🗄️')).join('') : '')
      + (CANAUX_ARCHIVES.length
          ? '<button class="canal canal-plus" data-canalarchives="1">'
            + (VOIR_ARCHIVES?'Masquer les rangés':'🗄️ '+CANAUX_ARCHIVES.length+' rangé'+(CANAUX_ARCHIVES.length>1?'s':''))
            + '</button>' : '')
      + (estBureau()
          ? '<button class="canal canal-plus" data-canalnouveau="1">+ Un canal</button>'
          : '<button class="canal canal-plus" data-canalpropose="1">+ Proposer un canal</button>')
      + '</div>'
    : '';
  const reserve = !!(COMPTOIR.data&&COMPTOIR.data.acces==='bureau');
  el.innerHTML='<p class="eyebrow">Entre nous</p><h1>'+esc(COMPTOIR.name)+'</h1>'
   +'<p class="chapeau">'+esc((COMPTOIR.data&&COMPTOIR.data.pitch)||'La discussion générale de l\'association.')+'</p>'
   +barre
   +(reserve?'<p class="hint" style="margin:0 0 10px">🔒 Ce canal ne sort pas du bureau : les adhérents ne le voient pas.</p>':'')
   /* Ranger un canal : réservé au bureau, et seulement sur un CANAL (jamais sur un fil de projet,
      qui se range depuis sa fiche) — et jamais sur le dernier ouvert, sinon plus de discussion. */
   +((estBureau()&&estComptoir(COMPTOIR))
      ? ((((COMPTOIR.data&&COMPTOIR.data.statut)||'actif')==='archive')
          ? '<p class="hint" style="margin:0 0 10px">🗄️ Ce canal est rangé. <button class="b nu sm" data-canalrouvrir="1">Le rouvrir</button></p>'
          : (CANAUX.length>1
              ? '<p class="hint" style="margin:0 0 10px"><button class="b nu sm" data-canalranger="1">🗄️ Ranger ce canal</button> — il sort de la barre, rien n\'est supprimé.</p>'
              : ''))
      : '')
   +'<div class="carte"><div id="fil"><p class="chargement">Chargement du fil…</p></div>'
   +redacteurHtml()+'</div>';
  COURANT=COMPTOIR;
  chargerFil(COMPTOIR.id,'#fil');
  vuSet(COMPTOIR.id);
}
/* changer de canal : on mémorise le choix, le temps de la session. Un canal peut être un fil
   permanent OU un projet — dans les deux cas c'est le même objet et le même fil de messages. */
function allerCanal(id){
  const c=CANAUX.find(x=>x.id===id)||CANAUX_ARCHIVES.find(x=>x.id===id)||PROJETS.find(x=>x.id===id);
  if(!c) return;
  COMPTOIR=c;
  try{ sessionStorage.setItem('bob_canal', id); }catch(e){}
  aller('comptoir');
}
/* Ranger / rouvrir un canal. On ne SUPPRIME jamais une conversation : les messages d'une
   association sont sa mémoire, et personne ne peut décider seul de l'effacer. */
async function rangerCanal(archive){
  if(!COMPTOIR) return;
  const d=Object.assign({},COMPTOIR.data||{},{statut:archive?'archive':'actif'});
  const r=await sb.from('projects').update({data:d}).eq('id',COMPTOIR.id);
  if(r.error){ toast('Impossible : '+r.error.message); return; }
  try{ sessionStorage.removeItem('bob_canal'); }catch(e){}
  await chargerProjets(); aller('comptoir');
}
/* Le canal général d'une asso qui n'en a aucun. Nommé avec le nom de l'asso, jamais en dur. */
async function ouvrirCanalGeneral(){
  const r=await sb.from('projects').insert({
    asso_id:ME.asso, name:'Le comptoir'+((ID&&ID.nom_court)?' '+ID.nom_court:''), owner_id:ME.id,
    data:{ type:'comptoir', acces:'tous', ordre:1,
           pitch:"La discussion générale de l'association : questions, idées, entraide, annonces." }
  }).select('id').maybeSingle();
  if(r.error){ toast('Ouverture impossible : '+r.error.message); return; }
  await chargerProjets(); aller('comptoir');
}
/* 09/08/2026 — créer un canal (bureau) ou en proposer un (adhérent). Volontairement sobre :
   le nom, et une question sur l'accès. Pas de formulaire, pas d'écran de plus — la demande
   était « sans pour autant alourdir le truc ». */
async function nouveauCanal(){
  const nom=(prompt('Le nom du canal ? (par exemple : Sorties, Matériel, Entraide)')||'').trim();
  if(!nom) return;
  const reserve=confirm('Réservé au bureau ?\n\nOK = seuls le bureau et les salariés le verront.\nAnnuler = tout le monde y a accès.');
  const r=await sb.from('projects').insert({
    asso_id:ME.asso, name:nom.slice(0,60), owner_id:ME.id,
    data:{ type:'comptoir', acces:(reserve?'bureau':'tous'), ordre:90,
           pitch:(reserve?'Entre membres du bureau.':'Un canal de discussion de l\'association.') }
  }).select('id').maybeSingle();
  if(r.error){ toast('Création impossible : '+r.error.message); return; }
  await chargerProjets();
  if(r.data&&r.data.id) allerCanal(r.data.id); else aller('comptoir');
}
/* Un adhérent ne crée pas de canal (sinon la liste enfle et personne ne range) : il le PROPOSE,
   par le même chemin que les autres idées — le bureau tranche. */
async function proposerCanal(){
  const nom=(prompt('Quel canal manque ? Dis-le en quelques mots, le bureau décidera.')||'').trim();
  if(!nom) return;
  const r=await sb.from('suggestions').insert({ asso_id:ME.asso, author_id:ME.id,
    author_name:ME.name, body:'Proposition de canal : '+nom, context:'Espace membre — comptoir' });
  if(r.error){ toast('Envoi impossible : '+r.error.message); return; }
  toast('✅ Proposition envoyée au bureau');
}

/* ══════════════════════════════════════════════════════════════════════════
   VUE · GALERIE
   Demandée par un adhérent le 06/08/2026 (« peut-être des vidéos, photos »).
   Aucune table nouvelle : les photos EXISTENT déjà, postées dans les fils —
   elles étaient simplement introuvables sans ouvrir chaque projet.
   ══════════════════════════════════════════════════════════════════════════ */
async function vueGalerie(el){
  const avec=POSTS.filter(m=>m.photo_path);
  if(!avec.length){
    el.innerHTML='<p class="eyebrow">Les images</p><h1>La galerie</h1>'
      +'<p class="chapeau">Toutes les photos partagées dans les fils de l\'association, au même endroit.</p>'
      +'<div class="carte">'+vide('📸','Aucune photo pour l\'instant',
        'Dès qu\'une photo est jointe à un message — dans un projet ou au comptoir — elle apparaît ici automatiquement. Rien à ranger.')+'</div>';
    return;
  }
  el.innerHTML='<p class="eyebrow">Les images</p><h1>La galerie</h1>'
    +'<p class="chapeau">'+avec.length+' photo'+(avec.length>1?'s':'')+' partagée'+(avec.length>1?'s':'')
    +' dans les fils de l\'association. Les images restent privées : chaque affichage passe par un lien temporaire.</p>'
    +'<div id="gal"><p class="chargement">Ouverture des images…</p></div>';
  await signer(avec.map(m=>m.photo_path));
  const g=$('#gal'); if(!g) return;
  const vus=avec.filter(m=>PHOTOS_URL[m.photo_path]);
  if(!vus.length){
    g.innerHTML='<div class="carte">'+vide('🔒','Images momentanément illisibles',
      'Les photos sont bien là, mais le coffre n\'a pas répondu. Recharge la page dans un instant.')+'</div>';
    return;
  }
  /* Regroupées par fil : une photo isolée ne dit rien, une planche par projet
     raconte une sortie. Les fils sans photo n'apparaissent pas. */
  const parProjet=new Map();
  vus.forEach(m=>{ if(!parProjet.has(m.project_id)) parProjet.set(m.project_id,[]); parProjet.get(m.project_id).push(m); });
  g.innerHTML=Array.from(parProjet.entries()).map(([pid,lot])=>{
    const p=(COMPTOIR&&COMPTOIR.id===pid)?COMPTOIR:PROJETS.find(x=>x.id===pid);
    return '<section style="margin-bottom:30px">'
      +'<h2 style="font-size:15.5px;margin:0 0 3px">'+esc((p&&p.name)||'Fil supprimé')+'</h2>'
      +'<p class="sous" style="margin:0 0 12px">'+lot.length+' photo'+(lot.length>1?'s':'')
      +' · la plus récente '+esc(ilYA(lot[0].created_at))+'</p>'
      +'<div class="gal">'+lot.map(m=>
        '<figure data-photo="'+esc(PHOTOS_URL[m.photo_path])+'" tabindex="0">'
        +'<img src="'+esc(PHOTOS_URL[m.photo_path])+'" alt="Photo partagée par '
        +esc(m.author_name||'un adhérent')+'" loading="lazy">'
        +'<figcaption>'+esc(m.author_name||'')+' · '+esc(ilYA(m.created_at))+'</figcaption></figure>').join('')
      +'</div></section>';
  }).join('');
}
async function signer(chemins){
  const manquants=chemins.filter(c=>c&&!PHOTOS_URL[c]);
  if(!manquants.length) return;
  const {data,error}=await sb.storage.from('projets').createSignedUrls(manquants,3600);
  if(error||!data) return;
  data.forEach(s=>{if(s&&s.path&&s.signedUrl)PHOTOS_URL[s.path]=s.signedUrl;});
}

const nomFichier=n=>String(n||'photo').toLowerCase().replace(/[^a-z0-9.]+/g,'-').replace(/^-+|-+$/g,'').slice(-60)||'photo.jpg';
async function envoyer(){
  if(!COURANT) return;
  const ta=$('#txtPost'); if(!ta) return;
  const corps=ta.value.trim();
  if(!corps&&!PHOTO){toast('Écris un message ou joins une photo.');return;}
  const btn=$('#btnEnvoyer'); btn.disabled=true; btn.textContent='Envoi…';
  try{
    let chemin=null;
    if(PHOTO){
      if(PHOTO.size>8*1024*1024){toast('Photo trop lourde (8 Mo maximum).');return;}
      chemin=ME.asso+'/'+COURANT.id+'/'+Date.now()+'-'+nomFichier(PHOTO.name);
      const {error:ue}=await sb.storage.from('projets').upload(chemin,PHOTO,{contentType:PHOTO.type||'image/jpeg'});
      if(ue){toast('Photo refusée : '+ue.message);return;}
    }
    const {error}=await sb.from('project_posts').insert({asso_id:ME.asso,project_id:COURANT.id,
      author_id:ME.id,author_name:ME.name,body:corps||null,photo_path:chemin});
    if(error){toast('Message refusé : '+error.message);return;}
    ta.value=''; PHOTO=null;

async function majData(patch,message){
  if(!COURANT||!peutEditer(COURANT)) return false;
  const d=Object.assign({},COURANT.data||{},patch);
  const {error}=await sb.from('projects').update({data:d,updated_at:new Date().toISOString()}).eq('id',COURANT.id);
  if(error){toast('Enregistrement impossible : '+error.message);return false;}
  COURANT.data=d;
  const p=PROJETS.find(x=>x.id===COURANT.id); if(p) p.data=d;
  if(message) toast(message);
  return true;
}
async function sauverProjet(){
  if(!COURANT||!peutEditer(COURANT)) return;
  const nom=$('#edNom').value.trim()||'Sans nom';
  const d=Object.assign({},COURANT.data||{},{pitch:$('#edPitch').value.trim(),statut:$('#edStatut').value});
  const {error}=await sb.from('projects').update({name:nom,data:d,updated_at:new Date().toISOString()}).eq('id',COURANT.id);
  if(error){toast('Enregistrement impossible : '+error.message);return;}
  COURANT.name=nom; COURANT.data=d;
  const p=PROJETS.find(x=>x.id===COURANT.id); if(p){p.name=nom;p.data=d;}
  toast('Projet mis à jour ✓');
  const t=$('#pmTitre'); if(t) t.textContent=nom;
}
async function basculerEtape(i,done){
  const js=(Array.isArray(COURANT.data&&COURANT.data.jalons)?COURANT.data.jalons:[]).slice();
  if(!js[i]) return;
  js[i]=Object.assign({},js[i],{done:!!done});
  if(await majData({jalons:js})) rendreEtapes();
}
async function supEtape(i){
  const js=(Array.isArray(COURANT.data&&COURANT.data.jalons)?COURANT.data.jalons:[]).slice();
  js.splice(i,1);
  if(await majData({jalons:js})) rendreEtapes();
}
async function addEtape(){
  const inp=$('#nvEtape'); const t=inp.value.trim(); if(!t) return;
  const js=(Array.isArray(COURANT.data&&COURANT.data.jalons)?COURANT.data.jalons:[]).slice();
  js.push({t:t,done:false});
  if(await majData({jalons:js})){inp.value='';rendreEtapes();}
}

/* ══════════════════════════════════════════════════════════════════════════
   CHARGEMENT DES DONNÉES
   ══════════════════════════════════════════════════════════════════════════ */
async function chargerProjets(){
  const {data,error}=await sb.from('projects').select('id,name,owner_id,data,created_at,updated_at')
    .order('updated_at',{ascending:false});
  if(error){toast('Lecture des projets impossible : '+error.message);PROJETS=[];return;}
  const tous=data||[];
  /* 09/08/2026 — plusieurs CANAUX de discussion, demandés par Guillaume (« le chat bureau, le
     chat général, le chat adhérent »). Un canal EST un fil de type `comptoir` : aucune table
     nouvelle. Les fils réservés (`data.acces = 'bureau'`) ne remontent même pas ici pour un
     adhérent — c'est la RLS qui les retire, pas un filtre d'écran (verrou posé en base le
     09/08 et prouvé par impersonation). L'ordre suit `data.ordre` puis le nom. */
  /* 09/08/2026 — un canal se RANGE quand il a fait son temps (demandé par Guillaume : « il faut
     un système où les conversations s'archivent »). Rien n'est supprimé : on le sort de la barre
     et il reste consultable. Même mécanique que les projets (`data.statut = 'archive'`). */
  CANAUX_ARCHIVES=tous.filter(p=>estComptoir(p)&&((p.data&&p.data.statut)||'actif')==='archive');
  CANAUX=tous.filter(p=>estComptoir(p)&&((p.data&&p.data.statut)||'actif')!=='archive').sort((a,b)=>
    ((a.data&&a.data.ordre)||0)-((b.data&&b.data.ordre)||0) || String(a.name).localeCompare(String(b.name)));
  /* on retrouve le canal choisi juste avant, s'il est toujours visible pour cette personne */
  let choisi=null; try{ choisi=sessionStorage.getItem('bob_canal'); }catch(e){}
  COMPTOIR=(choisi&&CANAUX.find(c=>c.id===choisi))||CANAUX[0]||null;
  PROJETS=tous.filter(p=>!estComptoir(p))
    .filter(p=>((p.data&&p.data.statut)||'actif')!=='archive'||p.owner_id===ME.id);
}
async function chargerPosts(){
  const {data,error}=await sb.from('project_posts')
    .select('id,project_id,author_id,author_name,body,photo_path,created_at')
    .order('created_at',{ascending:false}).limit(300);
  POSTS=(error||!data)?[]:data;

async function chargerParts(){
  const {data,error}=await sb.from('projet_participants').select('project_id,user_id,nom');
  PARTS=(error||!data)?[]:data;
}
async function chargerMateriel(){
  const {data,error}=await sb.from('materiel').select('*').order('created_at',{ascending:false});
  MATERIEL=(error||!data)?[]:data;
}

function ecranMessage(ic,titre,texte,bouton){

    +'<div class="carte" style="max-width:460px;width:100%">'+vide(ic,titre,texte,bouton||'')+'</div></div>';

async function demarrer(){
  /* 1. Qui es-tu ? */
  let session=null;
  try{ session=(await sb.auth.getSession()).data.session; }catch(e){}
  if(!session){
    ecranMessage('👋','Connecte-toi d\'abord',
      'Cet espace est réservé aux membres de l\'association. Connecte-toi — ou demande à rejoindre — et reviens ici.',
      '<a class="b p" href="connexion.html">Me connecter →</a>');
    return;
  }
  const {data:p,error:pe}=await sb.from('profiles')
    .select('id,full_name,email,role,statut,asso_id').eq('id',session.user.id).maybeSingle();
  if(pe||!p){
    ecranMessage('😕','Ton profil ne se lit pas',
      'Réessaie dans un instant, ou reconnecte-toi depuis la page de connexion.',
      '<a class="b g" href="connexion.html">Retour à la connexion</a>');
    return;
  }
  ME={id:p.id,name:(p.full_name||p.email||'').split('@')[0],role:p.role,statut:p.statut,asso:p.asso_id};

  /* 2. Quelle association ? Un compte sans association ne doit JAMAIS se
     rabattre sur une autre : il attend, et on le dit clairement. */
  if(!ME.asso){
    ecranMessage('⏳','Compte à rattacher',
      'Ton compte n\'est encore rattaché à aucune association. Le bureau doit le faire depuis son espace — préviens-le, il ne le voit pas tout seul.');
    return;
  }
  const {data:a}=await sb.from('associations').select('id,name,slug,features').eq('id',ME.asso).maybeSingle();
  ASSO=a||{id:ME.asso,name:'Mon association',slug:null,features:{}};

  /* 3. L'habillage, résolu depuis les données. `lireCharte` n'est tenté que
     pour ceux qui ont le droit de lire fiches_marque — sinon c'est un appel
     refusé à chaque ouverture, pour rien. */
  ID=await window.BobIdentite.resoudre(sb,ASSO,{lireCharte:estBureau()});
  const applique=window.BobIdentite.appliquer(ID,document);
  document.title='Mon espace — '+ID.nom;
  try{ localStorage.setItem('bob_asso',ASSO.slug==='case-bdn'?'case':(ASSO.slug||'')); }catch(e){}
  if(console&&console.info) console.info('[Bob] habillage « '+ID.nom+' » (source : '+ID._source+')',applique.contraste);

  $('#marque').innerHTML=window.BobIdentite.marqueHtml(ID,36)
    +'<div style="min-width:0"><span class="n">'+esc(ID.nom_court||ID.nom)+'</span>'
    +(ID.tagline?'<span class="t">'+esc(ID.tagline)+'</span>':'')+'</div>';
  $('#moi').innerHTML='<span class="av">'+esc(initiales(ME.name))+'</span>'
    +'<div style="min-width:0"><div class="nm">'+esc(ME.name)+'</div>'
    +'<div class="rl">'+esc(ME.role==='president'?'Président':ME.role==='tresorier'?'Trésorier':
       ME.role==='bureau'?'Bureau':'Adhérent')+'</div></div>';
  if(ID.site){ const l=$('#lienSite'); l.href=ID.site; l.style.display=''; }
  /* 09/08/2026 — le commutateur d'espaces. La gestion n'apparaît que pour qui peut y entrer
     (elle refuse les autres au boot : offrir le lien à un adhérent, c'est l'envoyer vers une
     porte fermée). L'espace famille suit le module Animation de l'asso. */
  try{
    const chef=['president','tresorier','bureau','personnel'].indexOf(ME.role)>=0;
    if(chef){ const g=$('#lienGestion'); if(g) g.style.display=''; }
    if(feat('f_metier_acm')){ const f=$('#lienFamille'); if(f) f.style.display=''; }
  }catch(e){}

  /* 4. Le compte est-il ouvert ? */
  if(ME.statut!=='actif'){
    ecranMessage('⏳','Ton compte attend une validation',
      'Le bureau de l\'association doit valider ton accès avant que tu puisses entrer. Reviens bientôt !');
    return;
  }
  if(!feat('projets_adherents')&&!feat('materiel')){
    ecranMessage('🔒','Espace pas encore ouvert',
      'Aucun module n\'est activé pour ton association. Parles-en au bureau : c\'est un réglage, pas un développement.');
    return;
  }

  /* 5. Les données. */
  await Promise.all([chargerProjets(),chargerPosts(),chargerParts()]);
  if(feat('materiel')) await chargerMateriel();

  const dep=(location.hash||'').replace('#','');
  aller(sectionsOuvertes().some(s=>s.k===dep)?dep:'accueil');
}

});

demarrer();

/* ═══ 📲 LE RACCOURCI SUR L'ÉCRAN DU TÉLÉPHONE ════════════════════════════════════════════
   09/08/2026. L'espace membre n'avait AUCUN manifeste : impossible d'en faire une icône. Le
   seul qui existait servait la gestion et portait « Bob — CASE du Bois de Nèfles » avec le vert
   du CASE — une autre asso qui l'aurait installé aurait eu le raccourci d'un autre client.
   Ici le manifeste est FABRIQUÉ à la volée depuis l'identité du tenant (nom, couleurs, logo).
   ⚠️ iOS ne lit pas le manifeste pour « Sur l'écran d'accueil » : il prend `apple-touch-icon` et
   `apple-mobile-web-app-title`, qu'on pose donc aussi — et comme Safari n'offre aucune invite
   automatique, on explique le geste au lieu d'attendre un prompt qui ne viendra jamais. */
(function(){
  function poser(){
    if(!ID) return;
    const nom=String(ID.nom||'Mon espace'), court=String(ID.nom_court||ID.nom||'Espace');
    try{
      let t=document.querySelector('meta[name="apple-mobile-web-app-title"]');
      if(!t){ t=document.createElement('meta'); t.name='apple-mobile-web-app-title'; document.head.appendChild(t); }
      t.content=court;
      let c=document.querySelector('meta[name="apple-mobile-web-app-capable"]');
      if(!c){ c=document.createElement('meta'); c.name='apple-mobile-web-app-capable'; c.content='yes'; document.head.appendChild(c); }
      /* le logo du tenant sert d'icône quand il en a un (nom de fichier local validé) */
      if(/^[A-Za-z0-9._-]{1,80}\.(png|jpg|jpeg|webp)$/.test(String(ID.logo||''))){
        let a=document.querySelector('link[rel="apple-touch-icon"]');
        if(!a){ a=document.createElement('link'); a.rel='apple-touch-icon'; document.head.appendChild(a); }
        a.href=ID.logo;
      }
      const icone=/^[A-Za-z0-9._-]{1,80}\.(png|jpg|jpeg|webp)$/.test(String(ID.logo||''))?ID.logo:'icon-192.png';
      const m={ name:'Mon espace — '+nom, short_name:court, start_url:'espace.html', scope:'.',
                display:'standalone', background_color:'#0a0910',
                theme_color:(/^#[0-9a-fA-F]{3,8}$/.test(String(ID.accent||''))?ID.accent:'#0a0910'),
                icons:[{src:icone,sizes:'192x192',type:'image/png',purpose:'any'},
                       {src:icone,sizes:'512x512',type:'image/png',purpose:'any'}] };
      let l=document.querySelector('link[rel="manifest"]');
      if(!l){ l=document.createElement('link'); l.rel='manifest'; document.head.appendChild(l); }
      l.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'}));
    }catch(e){}
  }
  /* l'identité arrive après la connexion : on pose dès qu'elle est là */
  const t=setInterval(()=>{ if(window.ID||typeof ID!=='undefined'&&ID){ clearInterval(t); poser(); } }, 400);
  setTimeout(()=>clearInterval(t), 20000);

  /* Android/Chrome propose une vraie invite : on la garde sous le coude pour notre bouton. */
  let invite=null;
  window.addEventListener('beforeinstallprompt', e=>{ e.preventDefault(); invite=e; });

  const btn=document.getElementById('btnRaccourci');
  if(btn) btn.addEventListener('click', async ()=>{
    if(invite){ invite.prompt(); invite=null; return; }
    const ios=/iPad|iPhone|iPod/.test(navigator.userAgent)
           || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
    const nom=(ID&&(ID.nom_court||ID.nom))||'ton espace';
    alert(ios
      ? '📲 Mettre '+nom+' sur ton écran d\'accueil\n\n'
        +'1. Touche le bouton Partager (le carré avec la flèche, en bas)\n'
        +'2. Fais défiler et choisis « Sur l\'écran d\'accueil »\n'
        +'3. Touche « Ajouter »\n\n'
        +'Tu auras une icône comme une vraie application.'
      : '📲 Mettre '+nom+' sur ton écran d\'accueil\n\n'
        +'Ouvre le menu de ton navigateur (les trois points), puis choisis\n'
        +'« Installer l\'application » ou « Ajouter à l\'écran d\'accueil ».');
  });
})();

/* ═══ 💡 LA BOÎTE À IDÉES ══════════════════════════════════════════════════════════════════
   09/08/2026, demandé par Guillaume : « est-ce qu'ils ont bien accès à la petite ampoule pour
   faire les demandes de changement ou de modification ? » — NON. Le bureau (app.html) et les
   familles du CASE (espace-adherent.html) l'avaient ; les adhérents de l'espace membre, non.
   Même table `suggestions` et même mécanique que l'espace famille : chacun voit SES envois
   (policy sur author_id), le bureau les lit tous dans son onglet Réglages.
   Le `context` dit d'où vient l'idée, pour que le bureau sache quel écran est visé. */
(function(){
  const st=document.createElement('style');
  st.textContent=
   '.idee-fab{position:fixed;right:18px;bottom:18px;z-index:60;width:54px;height:54px;border-radius:50%;'
  +'border:none;cursor:pointer;background:var(--brand-fill);color:var(--brand-ink);font-size:23px;'
  +'box-shadow:var(--shadow-lg);display:grid;place-items:center}'
  +'.idee-fab:hover{background:var(--brand-hover)}'
  +'.idee-panneau{position:fixed;right:18px;bottom:82px;z-index:60;width:min(92vw,380px);display:none;'
  +'background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);'
  +'box-shadow:var(--shadow-lg);padding:16px}'
  +'.idee-panneau.ouvert{display:block}'
  +'.idee-item{border-top:1px solid var(--line);padding:9px 0;font-size:13px}'
  +'.idee-item:first-child{border-top:0}'
  +'.idee-quand{color:var(--muted-2);font-size:11.5px}'
  +'@media(max-width:640px){.idee-fab{bottom:calc(var(--barH,64px) + 14px)}'
  +'.idee-panneau{bottom:calc(var(--barH,64px) + 78px)}}';
  document.head.appendChild(st);

  const fab=document.createElement('button');
  fab.className='idee-fab'; fab.type='button';
  fab.setAttribute('aria-label','Proposer une idée ou signaler un problème');
  fab.setAttribute('aria-expanded','false');
  fab.innerHTML='<span aria-hidden="true">💡</span>';

  const pan=document.createElement('div');
  pan.className='idee-panneau'; pan.id='ideePanneau';
  pan.innerHTML='<h2 style="margin:0 0 4px;font-size:16px">💡 Une idée, un souci ?</h2>'
   +'<p class="chapeau" style="margin:0 0 10px;font-size:13px">Dis-le avec tes mots : ce qui te manque, '
   +'ce qui ne marche pas, ce qu\'on pourrait faire autrement. Ça part au bureau.</p>'
   +'<textarea id="ideeTexte" class="champ" rows="3" style="width:100%" '
   +'placeholder="Par exemple : « on devrait pouvoir… »"></textarea>'
   +'<div style="display:flex;gap:8px;margin-top:9px"><button class="b p" id="ideeEnvoyer" type="button">Envoyer</button></div>'
   +'<div id="ideeListe" style="margin-top:12px"></div>';

  document.body.appendChild(fab); document.body.appendChild(pan);

  const STAT={nouvelle:'🆕 reçu', vue:'👀 vu', faite:'✅ fait', rejetee:'✖️ écarté'};
  async function mesIdees(){
    const box=document.getElementById('ideeListe'); if(!box||!ME) return;
    const r=await sb.from('suggestions').select('body,statut,created_at')
                    .eq('author_id',ME.id).order('created_at',{ascending:false}).limit(20);
    if(r.error){ box.innerHTML='<p class="idee-quand">Impossible de relire tes envois.</p>'; return; }
    const l=r.data||[];
    box.innerHTML=l.length
      ? l.map(s=>'<div class="idee-item"><div class="idee-quand">'
          +esc(new Date(s.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}))
          +' · '+esc(STAT[s.statut]||s.statut||'reçu')+'</div>'+esc(s.body)+'</div>').join('')
      : '<p class="idee-quand">Tes idées apparaîtront ici, avec ce que le bureau en a fait.</p>';
  }
  fab.addEventListener('click',()=>{
    const ouvert=!pan.classList.contains('ouvert');
    pan.classList.toggle('ouvert',ouvert);
    fab.setAttribute('aria-expanded',String(ouvert));
    if(ouvert){ mesIdees(); const t=document.getElementById('ideeTexte'); if(t) t.focus(); }
  });
  document.getElementById('ideeEnvoyer').addEventListener('click',async()=>{
    const t=document.getElementById('ideeTexte'); const corps=(t.value||'').trim();
    if(!corps){ t.focus(); return; }
    if(!ME||ME.statut!=='actif'){ alert('Ton compte doit être validé par le bureau avant d\'envoyer.'); return; }
    const btn=document.getElementById('ideeEnvoyer'); btn.disabled=true;
    const r=await sb.from('suggestions').insert({ asso_id:ME.asso, author_id:ME.id,
      author_name:ME.name, body:corps, context:'Espace membre — '+VUE });
    btn.disabled=false;
    /* ⚠️ supabase-js ne lève pas : on lit .error */
    if(r.error){ alert('Envoi impossible : '+r.error.message); return; }
    t.value=''; mesIdees();
  });
})();
</script>
</body>
</html>
