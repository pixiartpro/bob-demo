<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paiement — CASE du Bois de Nèfles</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<style>
  :root{--brand:#127a51;--brand-dk:#0f6b46;--ink:#16302a;--muted:#62756b;--bg:#f6f8f5;--card:#fff;--line:#e7efe9;}
  *{box-sizing:border-box}
  body{margin:0;font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 28px rgba(16,60,40,.08);max-width:440px;width:100%;padding:30px 26px;text-align:center}
  .logo{font-weight:800;color:var(--brand);font-size:14px;letter-spacing:.4px;text-transform:uppercase}
  h1{font-size:20px;margin:14px 0 2px}
  .sub{color:var(--muted);font-size:14px}
  .montant{font-size:42px;font-weight:800;color:var(--brand-dk);margin:16px 0 6px;letter-spacing:-1px}
  button{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:15px 22px;font-size:16px;font-weight:700;width:100%;cursor:pointer;margin-top:8px}
  button:hover{background:var(--brand-dk)}
  button:disabled{opacity:.6;cursor:default}
  .secure{color:var(--muted);font-size:12px;margin-top:16px}
  .state{padding:16px;border-radius:12px;font-size:15px}
  .ok{background:#e9f8f0;color:#0f6b46}
  .err{background:#fdecea;color:#b3402c}
  .muted{color:var(--muted)}
</style>
</head>
<body>
<div class="card">
  <div class="logo">CASE du Bois de Nèfles</div>
  <div id="content"><p class="muted">Chargement…</p></div>
  <div class="secure">🔒 Paiement sécurisé par HelloAsso — 100 % gratuit pour l'association</div>
</div>
<script>
const SB_URL = "https://dkidtwypclpwznleiqnq.supabase.co";
// 30/08/2026 : cle publiable (comme toutes les autres pages du site) — cette page
// etait la DERNIERE sur l'ancienne cle anon JWT, morte au premier re-cle des cles API.
const SB_ANON = "sb_publishable_HDfV-O2ION1Vw9v03aV_Qg_PkiAjLNo";
// Échappement HTML : d.libelle vient de la base (saison + nom d'asso modifiables) —
// il ne doit JAMAIS atteindre innerHTML brut (bug hérité tracé le 14/08/2026).
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search);
const token = (params.get('t') || params.get('token') || '').trim();
const retour = location.origin + location.pathname + '?t=' + encodeURIComponent(token);
const C = document.getElementById('content');
const euro = c => (c/100).toLocaleString('fr-FR',{minimumFractionDigits:2}) + ' €';

async function rpc(fn, body){
  try{
    const r = await fetch(SB_URL+'/rest/v1/rpc/'+fn, {method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_ANON,'Authorization':'Bearer '+SB_ANON},
      body: JSON.stringify(body)});
    return r.ok ? await r.json() : null;
  }catch(e){ return null; }
}
async function payer(btn){
  btn.disabled = true; btn.textContent = 'Ouverture du paiement…';
  try{
    const r = await fetch(SB_URL+'/functions/v1/helloasso-creer-paiement', {method:'POST',
      headers:{'Content-Type':'application/json','apikey':SB_ANON},
      body: JSON.stringify({pay_token: token, retour_url: retour})});
    const j = await r.json();
    if(j.redirectUrl){ location.href = j.redirectUrl; return; }
    if(j.error === 'deja_paye'){ render({deja_paye:true}); return; }
    // 30/08/2026 : le serveur rédige des messages précis (pause volontaire, acompte
    // au comptoir, canal verrouillé) — on les AFFICHE au lieu de promettre à tort
    // « réessaie dans un instant » sur une suspension qui ne reviendra pas seule.
    if(j.error === 'paiement_en_ligne_suspendu' || j.error === 'acompte_au_comptoir' || j.error === 'canal_en_ligne_verrouille'){
      C.innerHTML = '<div class="state err">'+esc(j.message || 'Le paiement en ligne est indisponible pour ce dossier — merci de régler au comptoir, ou contactez le CASE.')+'</div>'; return;
    }
    if(j.error === 'lien_invalide' || j.error === 'montant_trop_eleve'){
      C.innerHTML = '<div class="state err">Ce lien de paiement n’est plus valide.<br>Contactez le CASE pour en obtenir un nouveau.</div>'; return;
    }
    throw new Error(j.error || 'erreur');
  }catch(e){
    C.innerHTML = '<div class="state err">Impossible d’ouvrir le paiement pour le moment.</div>'
      + '<button onclick="location.reload()" style="margin-top:12px">Réessayer</button>';
  }
}
function render(d, note){
  if(params.get('paiement') === 'erreur'){
    C.innerHTML = '<div class="state err">Le paiement n’a pas abouti. Vous pouvez réessayer.</div>'
      + '<button onclick="location.href=retour" style="margin-top:12px">Réessayer</button>'; return;
  }
  if(!token){ C.innerHTML = '<div class="state err">Lien de paiement invalide.</div>'; return; }
  if(!d){ C.innerHTML = '<div class="state err">Ce lien de paiement n’est pas (ou plus) valide.<br>Contactez le CASE pour en obtenir un nouveau.</div>'; return; }
  if(d.deja_paye){ C.innerHTML = '<div class="state ok"><strong>Déjà réglé ✔</strong><br>Ce périscolaire a déjà été payé. Merci !</div>'; return; }
  // Acompte déjà enregistré au comptoir : on dit la vérité (le solde se règle au
  // CASE), au lieu de l'ancien « Déjà réglé ✔ » mensonger — bug attrapé le 30/08.
  if((d.deja_verse_cents||0) > 0){
    C.innerHTML = '<h1>'+esc(d.libelle||'Paiement')+'</h1>'
      + '<div class="state ok" style="margin-top:10px">Un règlement partiel de <b>'+euro(d.deja_verse_cents)+'</b> est déjà enregistré.<br>'
      + 'Reste <b>'+euro((d.montant_cents||0)-d.deja_verse_cents)+'</b> — le solde se règle au comptoir du CASE, ou contactez le bureau.</div>';
    return;
  }
  C.innerHTML = (note||'')
    + '<h1>'+esc(d.libelle||'Paiement')+'</h1>'
    + '<div class="sub">Montant à régler</div>'
    + '<div class="montant">'+euro(d.montant_cents)+'</div>'
    + '<button id="b">Payer en ligne</button>'
    + '<div class="muted" style="font-size:12px;margin-top:12px">💡 HelloAsso vous proposera une <b>contribution facultative</b> en plus du montant : elle soutient HelloAsso et <b>ne revient pas au CASE</b>. Vous pouvez la mettre à <b>0 €</b> — seul le montant ci-dessus est dû au CASE.</div>';
  document.getElementById('b').onclick = function(){ payer(this); };
}
(async function(){
  const p = params.get('paiement');
  if(p === 'erreur'){ render(); return; }
  if(!token){ render(); return; }
  const d = await rpc('peri_paiement_public', {p_token: token});
  if(p === 'ok'){
    // 30/08/2026 : « Merci » ne se dit plus à l'aveugle — on vérifie le paiement.
    // Le webhook peut mettre quelques instants : on distingue confirmé / en cours.
    if(d && d.deja_paye){
      C.innerHTML = '<div class="state ok"><strong>Merci ❤️ Réglé ✔</strong><br>Votre paiement est confirmé. Un justificatif vous est envoyé par HelloAsso.</div>';
    } else {
      C.innerHTML = '<div class="state ok"><strong>Paiement transmis 📨</strong><br>HelloAsso confirme votre règlement dans quelques minutes — un justificatif vous est envoyé par e-mail.<br><span class="muted" style="font-size:12px">Vous pouvez recharger cette page un peu plus tard pour voir la confirmation.</span></div>';
    }
    return;
  }
  // Retour « annulé » depuis HelloAsso : le lien reste valable — on réaffiche
  // l'écran de paiement (l'ancien code déclarait le lien mort, bug du 30/08).
  const note = (p === 'annule')
    ? '<div class="state muted" style="background:#f2f6f3;margin-bottom:10px">Paiement non terminé — vous pouvez reprendre quand vous voulez.</div>' : '';
  render(d, note);
})();
</script>
</body>
</html>
