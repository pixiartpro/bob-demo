<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mon espace — CASE du Bois de Nèfles</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script>
/* ══════════════════════════════════════════════════════════════════════════
   LA PORTE SE RÉSOUT AVANT LE PREMIER PIXEL — 08/08/2026
   ──────────────────────────────────────────────────────────────────────────
   BUG CORRIGÉ (signalé par Guillaume) : « il y a encore des images furtives
   CASE BDN quand on se connecte à BOKAF ».
   La page était ÉCRITE aux couleurs du CASE (titre, 🍍, « Mon espace CASE »,
   et surtout <img src="zanana-wave.png">, dont le téléchargement partait
   aussitôt) ; le script qui rhabille en BOKAF ne s'exécutait qu'APRÈS le
   chargement de supabase-js depuis un CDN. Résultat : l'identité du CASE
   restait à l'écran le temps d'un aller-retour réseau — plusieurs centaines
   de millisecondes, parfaitement visibles, sur le domaine d'une AUTRE asso.

   Règle qui en découle : une page multi-assos ne peint JAMAIS une identité
   avant de savoir laquelle. Ce script est en tête, sans dépendance réseau ;
   il décide la porte, pose le thème, et l'identité visible est écrite juste
   après le balisage qu'elle remplit. Aucune image d'identité n'a de `src`
   dans le HTML : c'est ce qui empêche la requête furtive.
   ══════════════════════════════════════════════════════════════════════════ */
window.BOB_PORTES = {
  case:  { pine:'🍍', nom:'CASE', nom2:'Bois de Nèfles', titre:'Mon espace — CASE du Bois de Nèfles',
           site:'vitrine.html', h1:'🍍 Mon espace CASE',
           sub:'Connectez-vous à votre espace, ou créez votre compte en 2 minutes.',
           mascotte:'zanana-wave.png',
           mascotteTxt:'Salut, c\'est <b style="color:var(--accent-txt)">Zanana</b> ! Connecte-toi à ton espace, ou crée ton compte 🍍',
           theme:{ vert:'#1f9d6b', vertFonce:'#0f6b46' } },
  bokaf: { pine:'🎬', nom:'BOKAF', nom2:'', titre:'Mon espace — association BOKAF', logoImg:'bokaf-logo.png',
           site:'site-bokaf.html', h1:'🎬 Mon espace BOKAF',
           sub:'Connecte-toi — ou demande à rejoindre l\'association : le bureau étudie chaque demande.',
           mascotte:'', mascotteTxt:'',
           theme:{ vert:'#d81e5b', vertFonce:'#b3134a', dark:true,
                   headerBg:'linear-gradient(100deg,#141318,#26182e 55%,#141318)',
                   flagBg:'#221826', flagInk:'#f1c6d8' } },
  pixiart:{ pine:'🔴', nom:'PIX-I-ART', nom2:'pilotage', titre:'Espace pilotage — PIX-I-ART',
           site:'vitrine.html', h1:'🔴 Espace pilotage',
           sub:'Connectez-vous à votre espace.', mascotte:'', mascotteTxt:'',
           theme:{ vert:'#E8300A', vertFonce:'#b3210a' } }
};
/* ── L'habillage vient de la BASE, sans jamais retarder le premier rendu ──────
   08/08/2026. La vue `assos_publiques` (lisible par anon : elle n'expose que de
   la décoration) est la source de vérité. Mais la page ne peut pas l'attendre :
   un aller-retour réseau avant de peindre, c'est précisément le flash qu'on
   vient de supprimer.
   D'où le compromis honnête : on peint INSTANTANÉMENT avec ce qu'on a en cache
   (ou, à la toute première visite, avec la table de secours ci-dessus), puis on
   rafraîchit le cache en arrière-plan pour la fois suivante. La donnée gagne
   toujours — avec une visite de retard, ce qui est sans conséquence pour un
   habillage. */
(function(){
  try{
    var cache=JSON.parse(localStorage.getItem('bob_portes')||'null');
    if(cache && typeof cache==='object'){
      Object.keys(cache).forEach(function(k){
        window.BOB_PORTES[k]=Object.assign({},window.BOB_PORTES[k]||{},cache[k]);
      });
    }
  }catch(e){ /* cache illisible : la table de secours suffit */ }
})();
(function(){
  function slug(){
    try{
      var u=new URL(location.href);
      var s=(u.searchParams.get('asso')||'').toLowerCase();
      /* porte par NOM DE DOMAINE (bokaf.bob.re, case.bob.re) : l'adresse suffit */
      if(!s){ var hp=location.hostname.toLowerCase().split('.')[0]; if(hp==='bokaf'||hp==='case') s=hp; }
      if(!s){ var m=location.pathname.toLowerCase().match(/(?:^|\/)(case|bokaf)(?:\/|\.html|$)/); if(m) s=m[1]; }
      if(!s){ s=(localStorage.getItem('bob_asso')||'').toLowerCase(); }
      /* porte DEMANDÉE mais inconnue (faute de frappe) ≠ aucune porte demandée :
         on le retient pour le signaler, on ne rattache jamais en silence. */
      if(s && !window.BOB_PORTES[s]){ window.__bobPorteInconnue=s; s='case'; }
      if(!window.BOB_PORTES[s]) s='case';
      try{ localStorage.setItem('bob_asso',s); }catch(e){}
      return s;
    }catch(e){ return 'case'; }
  }
  /* Encre lisible sur une couleur, calculée ici même : ce script ne doit
     dépendre d'AUCUN fichier, sinon on réintroduit l'attente qu'on vient de
     supprimer. (Même calcul WCAG que bob-identite.js, en 6 lignes.) */
  function lum(h){
    try{
      var v=String(h).replace('#',''); if(v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2];
      var c=[0,2,4].map(function(i){ var x=parseInt(v.substr(i,2),16)/255;
        return x<=0.03928 ? x/12.92 : Math.pow((x+0.055)/1.055,2.4); });
      return 0.2126*c[0]+0.7152*c[1]+0.0722*c[2];
    }catch(e){ return 0; }
  }
  function ratio(a,b){ var x=lum(a),y=lum(b),hi=Math.max(x,y),lo=Math.min(x,y); return (hi+0.05)/(lo+0.05); }
  function encreSur(bg){ return ratio(bg,'#ffffff') >= ratio(bg,'#141118') ? '#ffffff' : '#141118'; }
  function assombrir(h,p){
    try{
      var v=String(h).replace('#',''); if(v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2];
      var o=[0,2,4].map(function(i){ return Math.max(0,Math.round(parseInt(v.substr(i,2),16)*(1-p))); });
      return '#'+o.map(function(n){ return ('0'+n.toString(16)).slice(-2); }).join('');
    }catch(e){ return h; }
  }
  /* Un bouton plein porte un libellé BLANC — c'est le geste maison, et il doit se
     lire. Mesuré le 08/08/2026 : sur le vert du CASE #1f9d6b, le blanc ne rend que
     3,45:1, sous le seuil AA (4,5). Plutôt que de basculer le libellé en sombre —
     ce qui change l'allure de la marque —, on assombrit le REMPLISSAGE juste ce
     qu'il faut, en gardant la teinte. Le magenta BOKAF, lui, passe déjà (4,93) et
     n'est pas touché. */
  function remplissagePourBlanc(c){
    if(ratio(c,'#ffffff')>=4.5) return c;
    for(var i=1;i<=24;i++){ var f=assombrir(c,i*0.03); if(ratio(f,'#ffffff')>=4.5) return f; }
    return c;
  }
  function eclaircir(h,p){
    try{
      var v=String(h).replace('#',''); if(v.length===3) v=v[0]+v[0]+v[1]+v[1]+v[2]+v[2];
      var o=[0,2,4].map(function(i){ var n=parseInt(v.substr(i,2),16); return Math.round(n+(255-n)*p); });
      return '#'+o.map(function(n){ return ('0'+n.toString(16)).slice(-2); }).join('');
    }catch(e){ return h; }
  }
  /* La marque sert AUSSI de couleur de TEXTE (liens). C'est un rôle distinct du
     remplissage : un lien doit se lire sur le fond d'une carte. Mesuré le
     08/08/2026 : `--vert-fonce` servait aux DEUX — survol de bouton (donc plus
     sombre) et couleur de lien — deux exigences contradictoires en peau sombre,
     où « Mot de passe oublié ? » tombait à 2,86:1. On sépare les rôles. */
  function lisibleSur(c,fondCarte){
    if(ratio(c,fondCarte)>=4.5) return c;
    var versClair = lum(fondCarte) < 0.18;
    for(var i=1;i<=24;i++){
      var f = versClair ? eclaircir(c,i*0.045) : assombrir(c,i*0.045);
      if(ratio(f,fondCarte)>=4.5) return f;
    }
    return c;
  }

  var s=slug(), d=window.BOB_PORTES[s];
  window.BOB_PORTE=s;
  var r=document.documentElement;
  r.setAttribute('data-asso',s);
  var t=d.theme||{};
  /* La PEAU est un attribut : toute la feuille de style en découle, appliquée
     au premier rendu. On ne distribue plus des `element.style` après coup — ils
     arrivaient trop tard, c'était la cause du flash. */
  r.setAttribute('data-peau', t.dark ? 'sombre' : 'clair');
  try{ document.title=d.titre; }catch(e){}
  try{
    if(t.vert){
      var fill=remplissagePourBlanc(t.vert);
      r.style.setProperty('--vert',fill);
      r.style.setProperty('--ink-sur-marque','#ffffff');
      /* la couleur DÉCLARÉE reste disponible pour les liens et les filets */
      r.style.setProperty('--marque-declaree',t.vert);
    }
    if(t.vertFonce) r.style.setProperty('--vert-fonce',assombrir(remplissagePourBlanc(t.vert||t.vertFonce),.14));
    /* fond de carte de la peau courante : c'est là que les liens se posent */
    var fondCarte = t.dark ? '#17161f' : '#ffffff';
    r.style.setProperty('--marque-lisible', lisibleSur(t.vert||'#1f9d6b', fondCarte));
    /* le bouton secondaire aussi : son libellé doit se lire sur SA couleur */
    var second = t.dark ? '#2f6fdb' : '#f4b740';
    r.style.setProperty('--jaune',second);
    r.style.setProperty('--ink-sur-jaune',encreSur(second));
  }catch(e){}
  /* Seul reliquat en style injecté : l'en-tête dégradé, qui n'est pas un jeton. */
  if(t.dark && t.headerBg){
    var st=document.createElement('style');
    st.textContent='header{background:'+t.headerBg+'}';
    document.head.appendChild(st);
  }
})();
</script>

<style>
  /* 07/08/2026 — polices AUTO-HÉBERGÉES. Elles venaient du CDN Google : sur une
     page de CONNEXION, cela envoyait à un tiers l'adresse IP de chaque personne
     qui s'y présente, avant même qu'elle se connecte. Mêmes fontes, servies par
     nous ; au passage la page ne dépend plus d'un domaine externe pour s'afficher. */
  @font-face{font-family:'Poppins';src:url('fonts/poppins-600.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Poppins';src:url('fonts/poppins-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Poppins';src:url('fonts/poppins-800.woff2') format('woff2');font-weight:800;font-display:swap}
  @font-face{font-family:'Inter';src:url('fonts/inter-variable.woff2') format('woff2');font-weight:100 900;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-600.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-700.woff2') format('woff2');font-weight:700;font-display:swap}
  @font-face{font-family:'Sora';src:url('fonts/sora-800.woff2') format('woff2');font-weight:800;font-display:swap}

  /* ══════════════════════════════════════════════════════════════════════════
     08/08/2026 — PRÉSENTATION alignée sur l'espace membre (espace.html).
     ⚠️ Aucune fonction n'a été touchée : cette page porte du savoir chèrement
     acquis (compte banni, plafond d'envoi avec compte à rebours, refus d'une
     porte inconnue, messages traduits). On change la peau, pas la mécanique —
     les NOMS DE CLASSES sont donc conservés à l'identique.
     Les anciens noms (--vert, --jaune, --ananas…) restent définis et pointent
     vers les nouveaux jetons : les styles en ligne du HTML continuent de marcher.
     ══════════════════════════════════════════════════════════════════════════ */
  :root{
    /* peau claire par défaut (monde « chaleur ») ; la porte sombre surcharge plus bas */
    --bg:#f6f3ee; --bg-2:#fffdfa; --card:#ffffff; --surface-2:#f2ede6;
    --ink:#2c2521; --muted:#6b5d54; --muted-2:#7a6c62;
    --line:rgba(60,50,46,.13); --line-2:rgba(60,50,46,.24);
    --shadow:0 8px 24px rgba(120,90,70,.10); --shadow-lg:0 20px 54px rgba(120,90,70,.16);
    --radius:18px; --ease:cubic-bezier(.33,1,.68,1); --dur:.2s;
    --ls-titre:-.02em;
    --font-display:'Poppins',system-ui,sans-serif; --font-body:'Inter',system-ui,sans-serif;
    /* la marque de la porte (posée par le script de tête) */
    --vert:#1f9d6b; --vert-fonce:#0f6b46; --ink-sur-marque:#fff;
    --jaune:#f4b740; --ananas:#dc8f38; --accent-txt:#9c5410; --red:#c53b26;
    /* Sémantiques : elles portent un SENS (validé, en attente, bloqué) et ne
       prennent JAMAIS la couleur de l'asso — on y perdrait le sens. */
    --ok-soft:#e3f5ec;        --ok-ink:#14663f;
    --attention-soft:#fdf3e0; --attention-ink:#8a5a08;
    --alerte-soft:#fdecea;    --alerte-ink:#a3301c;
    --info-soft:#e8eefc;      --info-ink:#1f4fc4;
    --neutre-soft:#f1eef0;    --neutre-ink:#6f6570;
  }
  /* Porte sombre : mêmes classes, autres jetons. Aucune règle en double. */
  html[data-peau="sombre"]{
    --bg:#0a0910; --bg-2:#12111b; --card:#17161f; --surface-2:#1e1c29;
    --ink:#f5f4f8; --muted:#adaab9; --muted-2:#908c9e;
    --line:rgba(255,255,255,.085); --line-2:rgba(255,255,255,.16);
    --shadow:0 10px 30px -8px rgba(0,0,0,.55); --shadow-lg:0 32px 80px -28px rgba(0,0,0,.72);
    --font-display:'Sora',system-ui,sans-serif; --ls-titre:-.028em;
    --ease:cubic-bezier(.22,.61,.36,1); --dur:.24s;
    --jaune:#2f6fdb; --ananas:#c9c5d4; --accent-txt:#e6b8c8; --red:#ff6b5e;
    --ok-soft:#12261e;        --ok-ink:#4fd699;
    --attention-soft:#2a2113; --attention-ink:#f5b544;
    --alerte-soft:#2a1615;    --alerte-ink:#ff8c80;
    --info-soft:#141d2e;      --info-ink:#8fb4f2;
    --neutre-soft:#1e1c29;    --neutre-ink:#a9a5b5;
  }
  *{box-sizing:border-box;font-variant-numeric:tabular-nums}
  body{margin:0;font-family:var(--font-body);color:var(--ink);background:var(--bg);line-height:1.55;
       font-size:15px;-webkit-font-smoothing:antialiased}
  h1,h2,h3,h4{font-family:var(--font-display);letter-spacing:var(--ls-titre)}
  :focus-visible{outline:2px solid var(--vert);outline-offset:2px;border-radius:6px}
  .wrap{max-width:900px;margin:0 auto;padding:0 18px 56px}
  header{background:var(--bg-2);border-bottom:1px solid var(--line)}
  header .bar{display:flex;align-items:center;gap:10px;max-width:900px;margin:0 auto;padding:13px 18px}

  .logo .pine{font-size:24px} .logo b{color:var(--ink)} .logo span{color:var(--muted);font-weight:600}
  header nav{margin-left:auto;display:flex;gap:8px}
  header nav a{padding:8px 12px;border-radius:10px;font-weight:600;font-size:13.5px;text-decoration:none;color:var(--muted)}
  header nav a:hover{background:var(--surface-2);color:var(--ink)}
  .secure-flag{background:var(--surface-2);color:var(--muted);text-align:center;font-weight:600;font-size:12.5px;padding:9px 14px}
  h1.t{font-size:clamp(24px,3.2vw,31px);margin:26px 0 4px;font-weight:800}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:22px;
        box-shadow:var(--shadow);margin-bottom:18px}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}
  .field label{font-weight:600;font-size:13.5px;color:var(--muted)}
  input,select,textarea{font:inherit;color:var(--ink);padding:11px 13px;border:1px solid var(--line-2);
        border-radius:12px;background:var(--bg-2);width:100%;transition:border-color var(--dur) var(--ease)}
  input:focus,select:focus{outline:none;border-color:var(--vert)}

       transition:background var(--dur) var(--ease),transform var(--dur) var(--ease)}
  .btn:hover{transform:translateY(-1px)}

  .btn.p{background:var(--vert);color:var(--ink-sur-marque)} .btn.p:hover{background:var(--vert-fonce)}
  .btn.s{background:var(--jaune);color:var(--ink-sur-jaune,#5b4300)}
  .btn.g{background:var(--surface-2);color:var(--ink);border-color:var(--line)}

<body>
<div class="secure-flag">🔒 Espace sécurisé — connexion chiffrée (Supabase). Les accès sont accordés par le Président.</div>
<!-- ⚠️ AUCUNE identité d'association n'est écrite ici, et l'image de mascotte n'a
     PAS de `src` : c'est ce qui empêchait le 🍍, le titre « CASE » et le
     téléchargement de zanana-wave.png d'apparaître furtivement sur BOKAF.
     Le script juste en dessous les remplit, pendant l'analyse du document. -->
<header><div class="bar">
  <a class="logo" id="brandLogo" href="#"></a>
  <nav><a id="lienSitePublic" href="#">← Site public</a></nav>
</div></header>

<div class="wrap">
  <h1 class="t" id="titrePage"></h1>
  <p class="sub" id="sousTitrePage"></p>
  <div id="welcomeMascot" style="text-align:center;margin:4px 0 16px;display:none">
    <img id="mascotteImg" alt="" onerror="this.style.display='none'" style="width:92px;height:auto;filter:drop-shadow(0 8px 14px rgba(16,60,40,.18))">
    <p id="mascotteTxt" style="margin:6px auto 0;font-weight:700;color:#3a5246;font-size:14.5px;max-width:420px"></p>
  </div>
  <div id="app"><p class="muted">Chargement…</p></div>
</div>
<script>
/* Rendu de l'identité — inline et synchrone, juste après le balisage qu'il
   remplit : il s'exécute pendant l'analyse du document, donc AVANT le premier
   rendu, et sans attendre le moindre fichier distant. */
(function(){
  var d=window.BOB_PORTES[window.BOB_PORTE];
  /* 08/08/2026 — ces valeurs peuvent venir du cache alimenté par la BASE
     (assos_publiques, écrite par chaque président) : on échappe TOUT avant
     innerHTML, comme entree.html le fait déjà pour les mêmes champs. */

function isRateLimit(error){
  if(!error) return false;
  const c=String(error.code||''), m=String(error.message||'');
  return c.indexOf('rate_limit')>=0 || error.status===429 || /for security purposes|rate limit/i.test(m);

function noteCountdown(secs,btn,label,finHtml){
  let s=secs;
  if(btn){ btn.disabled=true; }
  if(__noteTimer){ clearInterval(__noteTimer); __noteTimer=null; }
  const tick=()=>{
    const el=document.getElementById('l_cd'); if(el) el.textContent=s+(s>1?' secondes':' seconde');
    if(s<=0){
      clearInterval(__noteTimer); __noteTimer=null;
      if(btn){ btn.disabled=false; if(label) btn.textContent=label; }
      note(finHtml||'✅ C\'est bon, tu peux réessayer maintenant.','ok');
      return;
    }
    s--;

  tick(); __noteTimer=setInterval(tick,1000);
}

function isBanned(error){
  if(!error) return false;

  if(/invalid login credentials/i.test(m))    return "Email ou mot de passe incorrect.";
  if(/password should be at least/i.test(m))  return "Mot de passe trop court : 6 caractères minimum.";
  if(/invalid email|email address/i.test(m))  return "Cette adresse email n'a pas l'air valide.";
  if(/expired|invalid.*token/i.test(m))       return "Ce lien a expiré. Redemande un email de connexion.";
  if(/network|fetch|failed to fetch/i.test(m))return "La connexion internet s'est interrompue. Réessaie dans un instant.";
  return "Quelque chose n'a pas fonctionné. Réessaie, ou demande un lien de connexion par email.";
}

/* Ce que la personne doit VRAIMENT savoir quand un email part : où le chercher.
   L'expéditeur n'est pas signé « CASE » → il finit souvent dans les indésirables. */
function mailEnvoyeHtml(email,quoi){
  return '📩 <b>Email envoyé à '+esc(email)+'</b>'
    +'<br>Ouvre ta boîte et clique le lien pour recevoir '+esc(quoi)+'.'
    +'<br><br>⚠️ <b>Rien dans la boîte de réception ? Regarde dans les courriers indésirables.</b> Le message vient de <i>noreply@mail.app.supabase.io</i> — il n\'est pas signé « CASE », c\'est normal.';
}
function mailPartiHtml(email,s){
  return '✅ <b>Ton email est déjà parti à '+esc(email)+' — inutile de recliquer.</b>'
    +'<br>Va le chercher dans ta boîte, <b>et surtout dans les courriers indésirables</b> (expéditeur : <i>noreply@mail.app.supabase.io</i>).'
    +'<br><br>⚠️ Si tu en as reçu plusieurs, <b>ouvre le plus récent</b> : chaque nouvel envoi annule le précédent.'
    +'<br><br>Si vraiment tu n\'as rien reçu, tu pourras redemander dans <b id="l_cd">'+s+'</b>.';
}
async function resetPwd(){
  const email=$('#l_email').value.trim();
  if(!email){toast('Entre ton email ci-dessus d\'abord.');return}
  noteHide();
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(!error){ note(mailEnvoyeHtml(email,'un nouveau mot de passe à choisir'),'ok'); return; }
  if(isRateLimit(error)){
    const s=waitSecs(error)||60;
    note(mailPartiHtml(email,s),'ok');
    noteCountdown(s,null,null,'✅ Tu peux redemander un email maintenant, si tu n\'as toujours rien reçu.');
    return;
  }
  note('😕 '+esc(authErrFr(error)),'ko');
}
async function changePwd(){
  const pw=prompt('Nouveau mot de passe (au moins 6 caractères) :'); if(pw===null)return;
  if(pw.length<6){toast('Trop court (min 6).');return}
  const {error}=await sb.auth.updateUser({password:pw});
  toast(error?error.message:'Mot de passe mis à jour ✓');
}

function togglePw(id,btn){

async function doRecovery(){

/* ---- Profil ---- */
async function loadProfile(user){
  const {data:p,error}=await sb.from('profiles').select('*').eq('id',user.id).single();
  if(error||!p) return null;
  if(!p.full_name && user.user_metadata && user.user_metadata.full_name){
    await sb.from('profiles').update({full_name:user.user_metadata.full_name}).eq('id',user.id);
    p.full_name=user.user_metadata.full_name;
  }
  return p;
}
async function refresh(){
  if(__recovery) return; /* on est en train de définir un nouveau mot de passe : ne pas écraser l'écran */
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ myProfile=null; renderLoggedOut(); return; }
  myProfile=await loadProfile(session.user);
  renderLoggedIn(session.user);
}

async function removeUser(id){

/* 07/08/2026 — VERS QUEL ESPACE ENVOYER UN ADHÉRENT ?
   La réponse était `pDoor==='bokaf' ? espace-projets : espace-adherent` : un test
   sur le NOM d'un client, qu'il aurait fallu rouvrir pour la 4e association. On
   demande désormais ce que l'asso a OUVERT (`associations.features`), pas qui elle
   est. Repli = l'espace famille historique → aucune régression pour le CASE. */
let MES_FEATURES=null, MON_SLUG='';
async function chargerFeatures(assoId){
  if(MES_FEATURES||!assoId) return MES_FEATURES;
  try{
    const {data,error}=await sb.from('associations').select('slug,features').eq('id',assoId).maybeSingle();
    MES_FEATURES=(error||!data)?{}:(data.features||{});
    if(!error&&data&&data.slug) MON_SLUG=String(data.slug).trim().toLowerCase();
  }catch(e){ MES_FEATURES={}; }
  return MES_FEATURES;
}
const featureOuverte=k=>{ const v=(MES_FEATURES||{})[k]; return v===true||v==='on'; };
/* 08/08/2026 — CHAQUE ESPACE EST LE MIROIR D'UN BOUQUET (décision Guillaume) :
   · f_metier_acm  (Ludo)  → l'espace FAMILLE d'abord : dossiers périscolaire/ACM,
     fiches sanitaires — c'est vital, il prime quand l'asso fait ce métier ;
   · projets_adherents (Ta Direction) → l'espace MEMBRE (projets, comptoir,
     galerie, matériel).
   Une asso peut avoir LES DEUX (le CASE depuis ce jour) : la famille atterrit
   sur son espace famille, qui offre un lien vers les projets — pas l'inverse,
   parce qu'un dossier d'enfant ne doit jamais être à deux clics derrière un
   fil de discussion. */
function espaceDeLAdherent(){
  if(featureOuverte('f_metier_acm')) return 'espace-adherent.html';
  if(featureOuverte('projets_adherents')) return 'espace.html';
  return 'espace-adherent.html';   /* repli historique */
}
function espaceLibelle(){ return featureOuverte('f_metier_acm')?'Mon espace famille':'Mon espace'; }

  $('#adminActive').innerHTML=`<h2>👥 Accès validés (${act.length})</h2>
    <p class="h">${isPres?'Tu peux modifier les rôles et retirer un accès.':'Tu vois les accès (seul le Président modifie les rôles et supprime).'}</p>`+

  ov.innerHTML=`<div style="background:#fff;max-width:520px;width:100%;border-radius:16px;padding:22px;box-shadow:var(--shadow-lg)">
    <h2 style="margin:0 0 4px">🔧 Rubriques — ${esc(u.full_name||u.email||'')}</h2>
    <p class="h">Pour chaque rubrique, choisis ce que cette personne peut faire. ⚠️ Une personne dont le rôle est « lecture seule » (Personnel, Intervenant, Adhérent) ne pourra de toute façon pas modifier, même en « Gestion ».</p>
    ${rows}
    ${secBlock}
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">
      <button class="btn g" onclick="closePerms()">Annuler</button>
      <button class="btn p" onclick="savePerms('${id}')">💾 Enregistrer</button>
    </div></div>`;
  document.body.appendChild(ov);
}
function closePerms(){ const o=document.getElementById('permsOverlay'); if(o)o.remove(); }
async function savePerms(id){
  const perms={}; MODULES.forEach(([k])=>{ const el=document.getElementById('pm_'+k); if(el)perms[k]=el.value; });
  const {error}=await sb.from('profiles').update({perms}).eq('id',id);
  // Sections cloisonnées : upsert des 3 cases (actif true/false → on garde l'historique) si l'écran les a affichées.
  let secErr=null;
  const u=adminProfiles.find(x=>x.id===id);
  if(u && u.role==='personnel' && document.getElementById('sec_acm')){
    const rows=SECTIONS.map(([code])=>{ const el=document.getElementById('sec_'+code); return { asso_id:u.asso_id, membre_id:id, section:code, actif:!!(el&&el.checked), accorde_par:myProfile.id, accorde_le:new Date().toISOString() }; });
    const r=await sb.from('sections_membres').upsert(rows,{onConflict:'asso_id,membre_id,section'});
    secErr=r.error;
  }
  const e=error||secErr;
  toast(e?e.message:'Droits enregistrés ✓'); closePerms(); await refresh();
}

/* re-render automatique quand l'état de connexion change */
sb.auth.onAuthStateChange((event)=>{
  if(event==='PASSWORD_RECOVERY'){ __recovery=true; renderRecovery(); return; }
  refresh();
});
refresh();
</script>
